<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="六爻排盘 - 传统纳甲筮法">
<meta name="theme-color" content="#000000">
<title>六爻排盘</title>
<link rel="manifest" href="manifest.json">
<style>
/* ===== 基础重置 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.875rem;
  line-height: 1.5;
  color: #000;
  background: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== 布局 ===== */
header, footer { padding: 0.75rem 1rem; border-bottom: 1px solid #ccc; }
footer { border-top: 1px solid #ccc; border-bottom: none; margin-top: auto; }
main { flex: 1; padding: 1rem; overflow: auto; }

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}
@media (min-width: 900px) {
  .grid { grid-template-columns: 320px 1fr 1fr; }
}

section {
  border: 1px solid #ccc;
  padding: 0.75rem;
  background: #fafafa;
}

h1 { font-size: 1.25rem; font-weight: 700; text-align: center; }
h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; border-bottom: 1px solid #ccc; padding-bottom: 0.25rem; }
h3 { font-size: 0.875rem; font-weight: 700; margin: 0.5rem 0 0.25rem; }

/* ===== 表单 ===== */
.field { margin-bottom: 0.75rem; }
.field label { display: block; font-weight: 700; margin-bottom: 0.25rem; font-size: 0.8125rem; }
.field input, .field select {
  width: 100%; padding: 0.5rem; border: 1px solid #999; background: #fff;
  font-family: inherit; font-size: 0.875rem;
}
.field input:focus, .field select:focus { outline: none; border-color: #000; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

/* ===== 按钮 ===== */
.btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
button {
  padding: 0.625rem 1rem; border: 1px solid #000; background: #000; color: #fff;
  font-family: inherit; font-size: 0.875rem; cursor: pointer;
}
button:hover { background: #333; }
button:disabled { background: #ccc; border-color: #ccc; color: #888; cursor: not-allowed; }
button.secondary { background: #fff; color: #000; }
button.secondary:hover { background: #eee; }

/* ===== 输出区 ===== */
.output { font-family: "Consolas", "Monospace", monospace; font-size: 0.75rem; line-height: 1.6; }
pre {
  white-space: pre-wrap; word-wrap: break-word;
  background: #fff; border: 1px solid #ddd; padding: 0.75rem;
  max-height: 60vh; overflow: auto;
}
.output-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.output-table th, .output-table td { border: 1px solid #ccc; padding: 0.25rem 0.5rem; text-align: left; }
.output-table th { background: #eee; font-weight: 700; }

/* ===== 状态 ===== */
.status { font-size: 0.75rem; color: #666; margin: 0.5rem 0; }
.status.ok { color: #060; }
.status.err { color: #c00; }

/* ===== 历史记录 ===== */
.history-list { max-height: 200px; overflow: auto; font-size: 0.75rem; }
.history-item { padding: 0.25rem 0; border-bottom: 1px dotted #ccc; cursor: pointer; }
.history-item:hover { background: #eee; }

/* ===== 进度 ===== */
#pyodide-progress { width: 100%; height: 4px; background: #eee; margin: 0.5rem 0; }
#pyodide-progress > div { height: 100%; background: #000; width: 0%; transition: width 0.2s; }
</style>
</head>
<body>
<header><h1>六爻排盘</h1></header>
<main class="grid">
  <!-- 起卦设置区 -->
  <section id="setup">
    <h2>起卦设置</h2>

    <div class="field">
      <label>起卦方式</label>
      <select id="method">
        <option value="manual">手动摆卦</option>
        <option value="random">模拟摇卦</option>
        <option value="time">时间起卦 (辅助)</option>
      </select>
    </div>

    <!-- 手动摆卦 -->
    <div id="panel-manual" class="panel">
      <div class="field">
        <label>卦名</label>
        <select id="hexagram"></select>
      </div>
      <div class="field">
        <label>动爻 (1-6，多爻用逗号分隔)</label>
        <input id="moving" type="text" placeholder="例: 2 或 2,4" value="2">
      </div>
    </div>

    <!-- 模拟摇卦 -->
    <div id="panel-random" class="panel" hidden>
      <p style="font-size:0.75rem;color:#666;margin-bottom:0.5rem;">模拟三钱六掷，自动推算主卦与动爻</p>
    </div>

    <!-- 时间起卦 -->
    <div id="panel-time" class="panel" hidden>
      <p style="font-size:0.75rem;color:#666;margin-bottom:0.5rem;">以当前时辰纳甲起卦（辅助法，非正统摇卦）</p>
      <div class="field">
        <label>使用时间</label>
        <input id="use-current-time" type="checkbox" checked> 当前时间
      </div>
      <div class="field" id="custom-time-field" hidden>
        <label>指定时间</label>
        <input id="custom-time" type="datetime-local">
      </div>
    </div>

    <!-- 通用参数 -->
    <div class="field-row">
      <div class="field"><label>月建</label><select id="month-zhi"></select></div>
      <div class="field"><label>日干支</label><input id="day-gz" type="text" placeholder="例: 辛卯"></div>
    </div>
    <div class="field">
      <label>用神 (可选)</label>
      <select id="yongshen"><option value="">自动/无</option></select>
    </div>

    <div class="btn-group">
      <button id="btn-cast" type="button">起卦</button>
      <button id="btn-clear" type="button" class="secondary">清空</button>
    </div>

    <div id="status" class="status"></div>
  </section>

  <!-- 卦盘结果区 -->
  <section id="board">
    <h2>卦盘结果</h2>
    <pre id="board-output" class="output" aria-label="卦盘文本">等待起卦...</pre>
  </section>

  <!-- AI 解卦文本区 -->
  <section id="ai">
    <h2>AI 解卦文本</h2>
    <pre id="ai-output" class="output" aria-label="AI 解卦结构化文本">等待起卦...</pre>
  </section>
</main>

<footer>
  <div class="btn-group">
    <button id="btn-copy-board" type="button" disabled>复制卦盘信息</button>
    <button id="btn-copy-ai" type="button" disabled>复制 AI 文本</button>
    <button id="btn-export-history" type="button" class="secondary">导出历史</button>
    <button id="btn-import-history" type="button" class="secondary">导入历史</button>
    <input id="import-file" type="file" accept=".json,.jsonl" hidden>
  </div>
</footer>

<!-- 内联资源：liuyao Python 包 -->
<script type="application/json" id="liuyao-pkg">
{"liuyao\\board.py":"\"\"\"排盘主逻辑：把主卦+动爻+月日 装成完整的结构化卦盘。\n\ncast_board(...) 返回 Board 对象，含六爻的全部信息：\n阴阳、纳甲、六亲、六神、世应、动变、空亡、月破、日破、暗动、化进化退、入墓、旺衰。\n\"\"\"\n\nfrom .data import (\n    BAGUA, BAGUA_NAGAN, BAGUA_NAZHI, DIZHI_WUXING, WUXING_MU,\n    JINSHEN, TUISHEN, LIUSHEN_ORDER, LIUSHEN_START, find_hexagram, HEXAGRAMS,\n    CHONG, LIUHE,\n)\n\n# 三合局：三支 + 化出五行\nSANHE_JU = [\n    (\"申\", \"子\", \"辰\", \"水\"),\n    (\"亥\", \"卯\", \"未\", \"木\"),\n    (\"寅\", \"午\", \"戌\", \"火\"),\n    (\"巳\", \"酉\", \"丑\", \"金\"),\n]\nfrom .wuxing import (\n    liuqin, wuxing_state, shier_changsheng, is_prosperous,\n    xunkong, is_void, is_chong, yongshen_role, i_sheng, i_ke,\n    is_true_void, four_gods,\n)\n\n\ndef _yao_to_bagua(yao3):\n    \"\"\"由三爻(自下而上 [初,中,上]，1阳0阴)反查八卦名。\"\"\"\n    for name, info in BAGUA.items():\n        if info[\"yao\"] == yao3:\n            return name\n    raise ValueError(f\"无法识别的卦象: {yao3}\")\n\n\ndef _find_changed_hexagram(changed_lower_gua, changed_upper_gua):\n    \"\"\"由变卦的上下卦反查变卦全名（可能查不到组合，返回 None）。\"\"\"\n    for rec in HEXAGRAMS.values():\n        if rec[\"upper\"] == changed_upper_gua and rec[\"lower\"] == changed_lower_gua:\n            return rec[\"name\"]\n    return None\n\n\ndef _spirit_effective(ln, board):\n    \"\"\"判定元神/忌神是否有力（有效）。返回 (effective, reason)。\n\n    effective: True=有力(能生用/能克用), False=无力(见生不生/虽动不克), None=中和不定。\n    依据《增删卜易·用神元神忌神仇神章》有力五条/无用六条/忌神不克七条综合。\n    \"\"\"\n    # —— 明显无力（任一命中即无力）——\n    if ln.month_break:\n        return (False, \"月破无力\")\n    if ln.in_grave:\n        return (False, \"入墓无力\")\n    if ln.jin_tui == \"化回头克\":\n        return (False, \"化回头克无力\")\n    if ln.jin_tui == \"化退神\":\n        return (False, \"化退神无力\")\n    if ln.day_break:\n        return (False, \"日破无力\")\n    if ln.true_void:\n        return (False, \"真空无力\")\n    if ln.state in (\"囚\", \"死\") and ln.void:\n        return (False, \"休囚旬空无力\")\n    if ln.state in (\"囚\", \"死\") and not ln.is_moving and not ln.dark_move:\n        return (False, \"休囚不动无力\")\n    if ln.state in (\"囚\", \"死\") and ln.stage in (\"绝\", \"墓\", \"死\") and not ln.is_moving:\n        return (False, \"衰绝无力\")\n\n    # —— 有力（任一命中即有力）——\n    if ln.is_on_month or ln.is_on_day:\n        return (True, \"临日月有力\")\n    if ln.state in (\"旺\", \"相\"):\n        return (True, \"旺相有力\")\n    if ln.jin_tui in (\"化回头生\", \"化进神\"):\n        return (True, f\"{ln.jin_tui}有力\")\n    if ln.is_moving or ln.dark_move:\n        return (True, \"发动有力\")\n\n    return (None, \"中和\")\n\n\ndef _analyze_gua_bian(board):\n    \"\"\"卦变生克：以主卦宫五行 vs 变卦宫五行（《增删卜易·卦变生克墓绝章》）。\n\n    变生/变比和为吉，变克为凶。\n    \"\"\"\n    main_wx = board.palace_wx\n    ch_name = board.changed_hexagram\n    if not ch_name:\n        board.gua_bian = \"变卦未明\"\n        return\n    ch_rec = find_hexagram(ch_name)\n    if not ch_rec:\n        board.gua_bian = \"变卦未明\"\n        return\n    ch_wx = ch_rec[\"palace_wx\"]\n    if ch_wx == main_wx:\n        board.gua_bian = \"变比和(吉)\"\n    elif i_sheng(ch_wx) == main_wx:\n        board.gua_bian = \"变生主(吉)\"\n    elif i_ke(ch_wx) == main_wx:\n        board.gua_bian = \"变克主(凶)\"\n    elif i_sheng(main_wx) == ch_wx:\n        board.gua_bian = \"主生变(泄)\"\n    elif i_ke(main_wx) == ch_wx:\n        board.gua_bian = \"主克变(制)\"\n    else:\n        board.gua_bian = \"无\"\n\n\ndef _detect_fu_fan_yin(board):\n    \"\"\"伏吟：主卦六爻地支全等于变卦地支(卦变而地支不变)。\n    反吟(简化)：所有动爻皆化回头冲(变爻地支冲动爻地支)。\"\"\"\n    moving = board.moving_lines\n    if not moving:\n        return\n    orig_zhi = [ln.zhi for ln in board.lines]\n    changed_zhi = [ln.change_zhi if ln.is_moving else ln.zhi for ln in board.lines]\n    if changed_zhi == orig_zhi:\n        board.fu_yin = True\n    if all(CHONG.get(ln.zhi) == ln.change_zhi for ln in moving):\n        board.fan_yin = True\n\n\ndef _detect_sanhe(board):\n    \"\"\"检测三合成局（《增删卜易·三合章》）：明动+暗动皆算动爻。\n\n    三支齐于卦内 + 动爻≥2 → 实成之局；\n    三支齐于卦内 + 动爻<2 → 虚合待用(支齐动不足)；\n    支不全(有支在月日不在卦) → 虚合(待填实)。\n    \"\"\"\n    board_zhi = {ln.zhi for ln in board.lines}\n    moving_zhi = {ln.zhi for ln in board.lines if ln.is_moving or ln.dark_move}\n    result = {}\n    for a, b, c, wx in SANHE_JU:\n        tri = (a, b, c)\n        in_board_zhi = [z for z in tri if z in board_zhi]\n        if not in_board_zhi:\n            continue\n        moving_count = sum(1 for z in tri if z in moving_zhi)\n        if len(in_board_zhi) == 3:\n            status = \"实成之局\" if moving_count >= 2 else \"虚合待用(支齐动不足)\"\n        else:\n            missing = [z for z in tri if z not in board_zhi]\n            status = f\"虚合(缺{''.join(missing)}，待填实)\"\n        result[f\"{a}{b}{c}{wx}局\"] = {\n            \"status\": status,\n            \"moving_count\": moving_count,\n            \"branches_in_board\": in_board_zhi,\n        }\n    board.sanhe = result\n\n\ndef _detect_liuhe_liuchong(board, ch_lower, ch_upper):\n    \"\"\"检测六合卦/六冲卦（《增删卜易·六合章/六冲章》）。\n\n    六合卦：初四、二五、三上 三对皆地支六合；六冲卦：三对皆六冲。主卦、变卦各检测。\n    \"\"\"\n    pairs = [(0, 3), (1, 4), (2, 5)]  # 初四 / 二五 / 三上（0 基）\n\n    def check(zhi6):\n        he = all(LIUHE[zhi6[a]] == zhi6[b] for a, b in pairs)\n        ch = all(CHONG[zhi6[a]] == zhi6[b] for a, b in pairs)\n        return he, ch\n\n    main = [l.zhi for l in board.lines]\n    board.is_liuhe_gua, board.is_liuchong_gua = check(main)\n    ch6 = BAGUA_NAZHI[ch_lower][:3] + BAGUA_NAZHI[ch_upper][3:]\n    board.changed_is_liuhe, board.changed_is_liuchong = check(ch6)\n\n\nclass Line:\n    \"\"\"单爻信息。\"\"\"\n\n    def __init__(self, position):\n        self.position = position            # 1..6\n        self.name = {1: \"初\", 2: \"二\", 3: \"三\", 4: \"四\", 5: \"五\", 6: \"上\"}[position]\n        self.yin_yang = None                # \"阳\"/\"阴\"\n        self.gan = None                     # 天干\n        self.zhi = None                     # 地支\n        self.wx = None                      # 爻五行\n        self.qin = None                     # 六亲\n        self.shen = None                    # 六神\n        self.is_world = False\n        self.is_response = False\n        self.is_moving = False\n        # 动爻变爻\n        self.change_gan = None\n        self.change_zhi = None\n        self.change_wx = None\n        self.change_qin = None\n        # 状态标记\n        self.void = False                   # 空亡\n        self.month_break = False            # 月破\n        self.day_strike = False             # 被日冲\n        self.dark_move = False              # 暗动\n        self.day_break = False              # 日破\n        self.prosperous = False             # 旺相\n        self.jin_tui = None                 # \"化进神\"/\"化退神\"/\"化回头生\"/\"化回头克\"/\"化比和\"\n        self.in_grave = []                  # 入墓原因列表\n        self.grave_is_void = False          # 是否入空墓\n        self.stage = None                   # 十二长生阶段\n        self.state = None                   # 旺相休囚死\n        self.role = None                    # 相对用神的四神角色(用/元/忌/仇/闲)\n        # —— 扩展判定 ——\n        self.is_on_day = False              # 临日建(爻支==日支)\n        self.is_on_month = False            # 临月建(爻支==月支)\n        self.true_void = False              # 真空(旬空且当季死地)\n        self.day_strike_moving = None       # 动爻被日冲：\"动而愈动\"/\"动而冲散\"\n        self.effective = None               # 元神/忌神是否有力 True/False/None\n        self.effective_reason = \"\"          # 有力/无力理由\n\n    def label(self):\n        \"\"\"组合标注，用于展示。\"\"\"\n        tags = []\n        if self.is_world:\n            tags.append(\"世\")\n        if self.is_response:\n            tags.append(\"应\")\n        if self.is_moving:\n            tags.append(\"动\")\n        if self.void:\n            tags.append(\"空\")\n        if self.month_break:\n            tags.append(\"月破\")\n        if self.dark_move:\n            tags.append(\"暗动\")\n        if self.day_break:\n            tags.append(\"日破\")\n        if self.is_on_month:\n            tags.append(\"临月建\")\n        if self.is_on_day:\n            tags.append(\"临日建\")\n        if self.true_void:\n            tags.append(\"真空\")\n        if self.day_strike_moving:\n            tags.append(self.day_strike_moving)\n        if self.jin_tui:\n            tags.append(self.jin_tui)\n        for g in self.in_grave:\n            tags.append(g)\n        if self.grave_is_void:\n            tags.append(\"空墓\")\n        return tags\n\n\nclass Board:\n    \"\"\"完整卦盘。\"\"\"\n\n    def __init__(self):\n        self.hexagram = None\n        self.changed_hexagram = None\n        self.palace = None\n        self.palace_wx = None\n        self.world_pos = None\n        self.response_pos = None\n        self.month_zhi = None\n        self.month_wx = None\n        self.day_gz = None\n        self.day_gan = None\n        self.day_zhi = None\n        self.day_wx = None\n        self.xunkong = None                 # (支,支)\n        self.lines = [Line(i) for i in range(1, 7)]\n        self.yongshen_qin = None\n        self.yongshen_lines = []\n        self.yongshen_wx = None             # 用神爻五行(四神判定基准)\n        # —— 卦级分析 ——\n        self.gua_bian = None                # 卦变生克(主宫vs变宫)\n        self.fu_yin = False                 # 伏吟\n        self.fan_yin = False                # 反吟\n        self.sanhe = {}                     # 三合局检测结果\n        self.is_liuhe_gua = False           # 主卦六合卦\n        self.is_liuchong_gua = False        # 主卦六冲卦\n        self.changed_is_liuhe = False       # 变卦六合卦\n        self.changed_is_liuchong = False    # 变卦六冲卦\n        self.changed_lower_gua = None       # 变卦下卦名\n        self.changed_upper_gua = None       # 变卦上卦名\n\n    def line(self, pos):\n        return self.lines[pos - 1]\n\n    @property\n    def moving_lines(self):\n        return [l for l in self.lines if l.is_moving]\n\n    def changed_line_info(self):\n        \"\"\"变卦六爻完整信息（初..上）：[{pos,yin_yang,gan,zhi,qin,shen}]。\n\n        纳甲/六亲按变卦本身排（六亲仍以主卦宫为我）；六神同主卦同位置（日干起，按爻位）。\n        \"\"\"\n        lower_gan = BAGUA_NAGAN[self.changed_lower_gua][0]\n        upper_gan = BAGUA_NAGAN[self.changed_upper_gua][1]\n        lower_zhi = BAGUA_NAZHI[self.changed_lower_gua][:3]\n        upper_zhi = BAGUA_NAZHI[self.changed_upper_gua][3:]\n        info = []\n        for pos in range(1, 7):\n            ln = self.line(pos)\n            yy = (\"阴\" if ln.yin_yang == \"阳\" else \"阳\") if ln.is_moving else ln.yin_yang\n            if pos <= 3:\n                gan, zhi = lower_gan, lower_zhi[pos - 1]\n            else:\n                gan, zhi = upper_gan, upper_zhi[pos - 4]\n            wx = DIZHI_WUXING[zhi]\n            info.append({\n                \"pos\": pos, \"yin_yang\": yy,\n                \"gan\": gan, \"zhi\": zhi,\n                \"qin\": liuqin(wx, self.palace_wx),\n                \"shen\": ln.shen,\n            })\n        return info\n\n\ndef cast_board(hexagram, moving, month_zhi, day_gz, yongshen_qin=None):\n    \"\"\"排盘。\n\n    Args:\n        hexagram: 卦名（全名\"地泽临\"或单字\"临\"）。\n        moving: 动爻位置，int 或 list[int]（1..6）。\n        month_zhi: 月建地支，如 \"未\"。\n        day_gz: 日干支，如 \"辛卯\"（完整两天字符）。\n        yongshen_qin: 可选，用神六亲名（\"妻财\"等），用于标注各爻角色。\n\n    Returns:\n        Board 对象。\n    \"\"\"\n    rec = find_hexagram(hexagram)\n    if rec is None:\n        raise ValueError(f\"未找到卦: {hexagram}\")\n\n    if isinstance(moving, int):\n        moving = [moving]\n    moving_set = set(moving)\n\n    board = Board()\n    board.hexagram = rec[\"name\"]\n    board.palace = rec[\"palace\"]\n    board.palace_wx = rec[\"palace_wx\"]\n    board.world_pos = rec[\"world\"]\n    board.response_pos = ((board.world_pos - 1 + 3) % 6) + 1\n\n    board.month_zhi = month_zhi\n    board.month_wx = DIZHI_WUXING[month_zhi]\n    board.day_gz = day_gz\n    board.day_gan = day_gz[0]\n    board.day_zhi = day_gz[1]\n    board.day_wx = DIZHI_WUXING[board.day_zhi]\n    board.xunkong = xunkong(day_gz)\n    board.yongshen_qin = yongshen_qin\n\n    upper, lower = rec[\"upper\"], rec[\"lower\"]\n    lower_yao = BAGUA[lower][\"yao\"]\n    upper_yao = BAGUA[upper][\"yao\"]\n    six_yao = lower_yao + upper_yao  # 初..上\n\n    # 变卦（动爻阴阳翻转）\n    changed_yao = [(1 - y if (i + 1) in moving_set else y) for i, y in enumerate(six_yao)]\n    changed_lower_gua = _yao_to_bagua(changed_yao[0:3])\n    changed_upper_gua = _yao_to_bagua(changed_yao[3:6])\n    board.changed_hexagram = _find_changed_hexagram(changed_lower_gua, changed_upper_gua)\n    board.changed_lower_gua = changed_lower_gua\n    board.changed_upper_gua = changed_upper_gua\n\n    # 六神起例\n    start_shen = LIUSHEN_START[board.day_gan]\n    start_idx = LIUSHEN_ORDER.index(start_shen)\n\n    # 装每爻\n    lower_gan, upper_gan = BAGUA_NAGAN[lower][0], BAGUA_NAGAN[upper][1]\n    lower_zhi = BAGUA_NAZHI[lower][:3]\n    upper_zhi = BAGUA_NAZHI[upper][3:]\n\n    for pos in range(1, 7):\n        ln = board.line(pos)\n        idx = pos - 1\n        ln.yin_yang = \"阳\" if six_yao[idx] == 1 else \"阴\"\n        if pos <= 3:\n            ln.gan = lower_gan\n            ln.zhi = lower_zhi[idx]\n        else:\n            ln.gan = upper_gan\n            ln.zhi = upper_zhi[idx - 3]\n        ln.wx = DIZHI_WUXING[ln.zhi]\n        ln.qin = liuqin(ln.wx, board.palace_wx)\n        ln.shen = LIUSHEN_ORDER[(start_idx + idx) % 6]\n        ln.is_world = (pos == board.world_pos)\n        ln.is_response = (pos == board.response_pos)\n        ln.is_moving = pos in moving_set\n\n        # 旺衰\n        ln.state = wuxing_state(ln.wx, board.month_wx)\n        ln.stage = shier_changsheng(ln.wx, ln.zhi)\n        ln.prosperous = is_prosperous(ln.wx, ln.zhi, board.month_zhi, board.day_zhi)\n\n        # 空亡\n        ln.void = is_void(ln.zhi, day_gz)\n        ln.true_void = ln.void and is_true_void(ln.wx, board.month_zhi)\n        # 月破\n        ln.month_break = is_chong(board.month_zhi, ln.zhi)\n        # 日冲\n        ln.day_strike = is_chong(board.day_zhi, ln.zhi)\n        # 临日月建\n        ln.is_on_month = (ln.zhi == board.month_zhi)\n        ln.is_on_day = (ln.zhi == board.day_zhi)\n        # 暗动 / 日破（静爻被日冲）\n        if ln.day_strike and not ln.is_moving:\n            if ln.prosperous:\n                ln.dark_move = True\n            else:\n                ln.day_break = True\n        # 动爻被日冲（《增删卜易·日辰章》：旺动愈动，衰动冲散）\n        if ln.day_strike and ln.is_moving:\n            ln.day_strike_moving = \"动而愈动\" if ln.prosperous else \"动而冲散\"\n\n    # 动爻变爻\n    ch_lower_gan, ch_upper_gan = BAGUA_NAGAN[changed_lower_gua][0], BAGUA_NAGAN[changed_upper_gua][1]\n    ch_lower_zhi = BAGUA_NAZHI[changed_lower_gua][:3]\n    ch_upper_zhi = BAGUA_NAZHI[changed_upper_gua][3:]\n\n    for ln in board.moving_lines:\n        p = ln.position\n        if p <= 3:\n            ln.change_gan = ch_lower_gan\n            ln.change_zhi = ch_lower_zhi[p - 1]\n        else:\n            ln.change_gan = ch_upper_gan\n            ln.change_zhi = ch_upper_zhi[p - 4]\n        ln.change_wx = DIZHI_WUXING[ln.change_zhi]\n        ln.change_qin = liuqin(ln.change_wx, board.palace_wx)\n\n        # 化进退 / 回头生克\n        if ln.wx == ln.change_wx:\n            if JINSHEN.get(ln.zhi) == ln.change_zhi:\n                ln.jin_tui = \"化进神\"\n            elif TUISHEN.get(ln.zhi) == ln.change_zhi:\n                ln.jin_tui = \"化退神\"\n            else:\n                ln.jin_tui = \"化比和\"\n        else:\n            if i_sheng(ln.change_wx) == ln.wx:\n                ln.jin_tui = \"化回头生\"\n            elif i_ke(ln.change_wx) == ln.wx:\n                ln.jin_tui = \"化回头克\"\n            else:\n                ln.jin_tui = \"化他\"\n\n    # 入墓\n    for ln in board.lines:\n        mu = WUXING_MU[ln.wx]\n        reasons = []\n        if board.month_zhi == mu:\n            reasons.append(\"月墓\")\n        if board.day_zhi == mu:\n            reasons.append(\"日墓\")\n        for other in board.lines:\n            if other.is_moving and other.zhi == mu and other.position != ln.position:\n                reasons.append(\"动爻墓\")\n        if ln.is_moving and ln.change_zhi == mu:\n            reasons.append(\"化墓\")\n        ln.in_grave = reasons\n        # 空墓：入墓 且 墓库地支落空亡\n        if reasons and mu in board.xunkong:\n            ln.grave_is_void = True\n\n    # 用神四神角色 + 元神/忌神有力无力（以用神爻五行为基准）\n    if yongshen_qin:\n        for ln in board.lines:\n            if ln.qin == yongshen_qin:\n                board.yongshen_lines.append(ln)\n        # 用神五行基准：取最旺者，否则取第一个\n        if board.yongshen_lines:\n            ys_sorted = sorted(\n                board.yongshen_lines,\n                key=lambda l: (l.is_on_month or l.is_on_day, l.prosperous,\n                               l.state in (\"旺\", \"相\")),\n                reverse=True,\n            )\n            yongshen_wx = ys_sorted[0].wx\n        else:\n            yongshen_wx = None\n        board.yongshen_wx = yongshen_wx\n        for ln in board.lines:\n            ln.role = yongshen_role(ln.wx, yongshen_wx) if yongshen_wx else None\n            if ln in board.yongshen_lines:\n                ln.role = \"用神\"\n            # 元神/忌神判有力无力\n            if ln.role in (\"元神\", \"忌神\"):\n                eff, reason = _spirit_effective(ln, board)\n                ln.effective = eff\n                ln.effective_reason = reason\n\n    # —— 卦级分析：卦变生克 / 反伏 / 三合 / 六合六冲卦 ——\n    _analyze_gua_bian(board)\n    _detect_fu_fan_yin(board)\n    _detect_sanhe(board)\n    _detect_liuhe_liuchong(board, changed_lower_gua, changed_upper_gua)\n\n    return board\n","liuyao\\data.py":"\"\"\"六爻排盘静态数据。\n\n包含：八卦属性、八卦纳甲（六爻天干地支）、六十四卦（宫属/世爻/上下卦）、\n五行生克、地支五行、地支冲、五行墓库、化进化退、旬空等。\n\n所有数据为主流综合派（《增删卜易》一脉）的标准取值。\n\"\"\"\n\n# ============================================================\n# 天干 / 地支\n# ============================================================\nTIANGAN = \"甲乙丙丁戊己庚辛壬癸\"\nDIZHI = \"子丑寅卯辰巳午未申酉戌亥\"\n\n# 地支 -> 五行\nDIZHI_WUXING = {\n    \"子\": \"水\", \"丑\": \"土\", \"寅\": \"木\", \"卯\": \"木\", \"辰\": \"土\", \"巳\": \"火\",\n    \"午\": \"火\", \"未\": \"土\", \"申\": \"金\", \"酉\": \"金\", \"戌\": \"土\", \"亥\": \"水\",\n}\n\n# 地支相冲\nCHONG = {\n    \"子\": \"午\", \"午\": \"子\", \"丑\": \"未\", \"未\": \"丑\", \"寅\": \"申\", \"申\": \"寅\",\n    \"卯\": \"酉\", \"酉\": \"卯\", \"辰\": \"戌\", \"戌\": \"辰\", \"巳\": \"亥\", \"亥\": \"巳\",\n}\n\n# 地支六合\nLIUHE = {\n    \"子\": \"丑\", \"丑\": \"子\", \"寅\": \"亥\", \"亥\": \"寅\", \"卯\": \"戌\", \"戌\": \"卯\",\n    \"辰\": \"酉\", \"酉\": \"辰\", \"巳\": \"申\", \"申\": \"巳\", \"午\": \"未\", \"未\": \"午\",\n}\n\n# ============================================================\n# 五行\n# ============================================================\nWUXING = [\"木\", \"火\", \"土\", \"金\", \"水\"]\n\n# 五行相生：我 -> 我生\nWUXING_SHENG = {\"木\": \"火\", \"火\": \"土\", \"土\": \"金\", \"金\": \"水\", \"水\": \"木\"}\n\n# 五行相克：我 -> 我克\nWUXING_KE = {\"木\": \"土\", \"土\": \"水\", \"水\": \"火\", \"火\": \"金\", \"金\": \"木\"}\n\n# 五行墓库（地支）\nWUXING_MU = {\"木\": \"未\", \"火\": \"戌\", \"金\": \"丑\", \"水\": \"辰\", \"土\": \"辰\"}\n\n# 化进神：动爻地支 -> 变爻地支（同五行，地支前进）\nJINSHEN = {\n    \"寅\": \"卯\", \"巳\": \"午\", \"申\": \"酉\", \"亥\": \"子\",\n    \"丑\": \"辰\", \"辰\": \"未\", \"未\": \"戌\",\n}\n# 化退神：进神的反向\nTUISHEN = {v: k for k, v in JINSHEN.items()}\n\n# ============================================================\n# 八卦\n# ============================================================\n# 八卦：爻象自下而上 [初, 中, 上]（1=阳, 0=阴），五行，自然象\nBAGUA = {\n    \"乾\": {\"yao\": [1, 1, 1], \"wx\": \"金\", \"xiang\": \"天\"},\n    \"兑\": {\"yao\": [1, 1, 0], \"wx\": \"金\", \"xiang\": \"泽\"},\n    \"离\": {\"yao\": [1, 0, 1], \"wx\": \"火\", \"xiang\": \"火\"},\n    \"震\": {\"yao\": [1, 0, 0], \"wx\": \"木\", \"xiang\": \"雷\"},\n    \"巽\": {\"yao\": [0, 1, 1], \"wx\": \"木\", \"xiang\": \"风\"},\n    \"坎\": {\"yao\": [0, 1, 0], \"wx\": \"水\", \"xiang\": \"水\"},\n    \"艮\": {\"yao\": [0, 0, 1], \"wx\": \"土\", \"xiang\": \"山\"},\n    \"坤\": {\"yao\": [0, 0, 0], \"wx\": \"土\", \"xiang\": \"地\"},\n}\n\n# 八卦纳干：内卦(下) / 外卦(上)\nBAGUA_NAGAN = {\n    \"乾\": (\"甲\", \"壬\"), \"坤\": (\"乙\", \"癸\"), \"坎\": (\"戊\", \"戊\"), \"离\": (\"己\", \"己\"),\n    \"震\": (\"庚\", \"庚\"), \"巽\": (\"辛\", \"辛\"), \"艮\": (\"丙\", \"丙\"), \"兑\": (\"丁\", \"丁\"),\n}\n\n# 八卦纳支：六爻地支（顺序：初爻→上爻，即内卦三爻 + 外卦三爻）\nBAGUA_NAZHI = {\n    \"乾\": [\"子\", \"寅\", \"辰\", \"午\", \"申\", \"戌\"],\n    \"坤\": [\"未\", \"巳\", \"卯\", \"丑\", \"亥\", \"酉\"],\n    \"坎\": [\"寅\", \"辰\", \"午\", \"申\", \"戌\", \"子\"],\n    \"离\": [\"卯\", \"丑\", \"亥\", \"酉\", \"未\", \"巳\"],\n    \"震\": [\"子\", \"寅\", \"辰\", \"午\", \"申\", \"戌\"],\n    \"巽\": [\"丑\", \"亥\", \"酉\", \"未\", \"巳\", \"卯\"],\n    \"艮\": [\"辰\", \"午\", \"申\", \"戌\", \"子\", \"寅\"],\n    \"兑\": [\"巳\", \"卯\", \"丑\", \"亥\", \"酉\", \"未\"],\n}\n\n# ============================================================\n# 六神\n# ============================================================\nLIUSHEN_ORDER = [\"青龙\", \"朱雀\", \"勾陈\", \"螣蛇\", \"白虎\", \"玄武\"]\n\n# 日干 -> 初爻所起六神\nLIUSHEN_START = {\n    \"甲\": \"青龙\", \"乙\": \"青龙\",\n    \"丙\": \"朱雀\", \"丁\": \"朱雀\",\n    \"戊\": \"勾陈\",\n    \"己\": \"螣蛇\",\n    \"庚\": \"白虎\", \"辛\": \"白虎\",\n    \"壬\": \"玄武\", \"癸\": \"玄武\",\n}\n\n# 六神性情（供解读参考）\nLIUSHEN_NATURE = {\n    \"青龙\": \"喜庆、桃花、文书\",\n    \"朱雀\": \"口舌、是非、消息\",\n    \"勾陈\": \"拖延、牵缠、旧事\",\n    \"螣蛇\": \"虚惊、怪异、纠缠\",\n    \"白虎\": \"血光、丧服、刚猛\",\n    \"玄武\": \"暗昧、隐私、欺骗\",\n}\n\n# ============================================================\n# 旬空（按旬号 0..5）\n# ============================================================\n# 旬号 = 六十甲子序号 // 10\nXUNKONG_BY_XUN = [\n    (\"戌\", \"亥\"),  # 甲子旬\n    (\"申\", \"酉\"),  # 甲戌旬\n    (\"午\", \"未\"),  # 甲申旬\n    (\"辰\", \"巳\"),  # 甲午旬\n    (\"寅\", \"卯\"),  # 甲辰旬\n    (\"子\", \"丑\"),  # 甲寅旬\n]\n\n# ============================================================\n# 十二长生（用于旺衰辅助判定）\n# ============================================================\n# 每行的十二长生地支序列（长生→养，对应地支顺序由各行长生位起顺行）\nSHIER_CHANGSHENG_START = {\"木\": \"亥\", \"火\": \"寅\", \"金\": \"巳\", \"水\": \"申\", \"土\": \"寅\"}\nSHIER_NAMES = [\"长生\", \"沐浴\", \"冠带\", \"临官\", \"帝旺\", \"衰\",\n               \"病\", \"死\", \"墓\", \"绝\", \"胎\", \"养\"]\n# 进气旺相的阶段\nSHIER_STRONG = {\"长生\", \"冠带\", \"临官\", \"帝旺\"}\nSHIER_WEAK = {\"衰\", \"病\", \"死\", \"墓\", \"绝\"}\n\n\n# ============================================================\n# 六十四卦\n# ============================================================\n# 每个卦：(全名, 单字别名, 上卦, 下卦, 宫, 宫五行, 世爻位置1-6)\n# 世爻：八纯=6, 一世=1, 二世=2, 三世=3, 四世=4, 五世=5, 游魂=4, 归魂=3\n_HEX = [\n    # 乾宫（金）\n    (\"乾为天\", \"乾\", \"乾\", \"乾\", \"乾\", \"金\", 6),\n    (\"天风姤\", \"姤\", \"乾\", \"巽\", \"乾\", \"金\", 1),\n    (\"天山遁\", \"遁\", \"乾\", \"艮\", \"乾\", \"金\", 2),\n    (\"天地否\", \"否\", \"乾\", \"坤\", \"乾\", \"金\", 3),\n    (\"风地观\", \"观\", \"巽\", \"坤\", \"乾\", \"金\", 4),\n    (\"山地剥\", \"剥\", \"艮\", \"坤\", \"乾\", \"金\", 5),\n    (\"火地晋\", \"晋\", \"离\", \"坤\", \"乾\", \"金\", 4),   # 游魂\n    (\"火天大有\", \"大有\", \"离\", \"乾\", \"乾\", \"金\", 3),  # 归魂\n    # 兑宫（金）\n    (\"兑为泽\", \"兑\", \"兑\", \"兑\", \"兑\", \"金\", 6),\n    (\"泽水困\", \"困\", \"兑\", \"坎\", \"兑\", \"金\", 1),\n    (\"泽地萃\", \"萃\", \"兑\", \"坤\", \"兑\", \"金\", 2),\n    (\"泽山咸\", \"咸\", \"兑\", \"艮\", \"兑\", \"金\", 3),\n    (\"水山蹇\", \"蹇\", \"坎\", \"艮\", \"兑\", \"金\", 4),\n    (\"地山谦\", \"谦\", \"坤\", \"艮\", \"兑\", \"金\", 5),\n    (\"雷山小过\", \"小过\", \"震\", \"艮\", \"兑\", \"金\", 4),  # 游魂\n    (\"雷泽归妹\", \"归妹\", \"震\", \"兑\", \"兑\", \"金\", 3),  # 归魂\n    # 离宫（火）\n    (\"离为火\", \"离\", \"离\", \"离\", \"离\", \"火\", 6),\n    (\"火山旅\", \"旅\", \"离\", \"艮\", \"离\", \"火\", 1),\n    (\"火风鼎\", \"鼎\", \"离\", \"巽\", \"离\", \"火\", 2),\n    (\"火水未济\", \"未济\", \"离\", \"坎\", \"离\", \"火\", 3),\n    (\"山水蒙\", \"蒙\", \"艮\", \"坎\", \"离\", \"火\", 4),\n    (\"风水涣\", \"涣\", \"巽\", \"坎\", \"离\", \"火\", 5),\n    (\"天水讼\", \"讼\", \"乾\", \"坎\", \"离\", \"火\", 4),   # 游魂\n    (\"天火同人\", \"同人\", \"乾\", \"离\", \"离\", \"火\", 3),  # 归魂\n    # 震宫（木）\n    (\"震为雷\", \"震\", \"震\", \"震\", \"震\", \"木\", 6),\n    (\"雷地豫\", \"豫\", \"震\", \"坤\", \"震\", \"木\", 1),\n    (\"雷水解\", \"解\", \"震\", \"坎\", \"震\", \"木\", 2),\n    (\"雷风恒\", \"恒\", \"震\", \"巽\", \"震\", \"木\", 3),\n    (\"地风升\", \"升\", \"坤\", \"巽\", \"震\", \"木\", 4),\n    (\"水风井\", \"井\", \"坎\", \"巽\", \"震\", \"木\", 5),\n    (\"泽风大过\", \"大过\", \"兑\", \"巽\", \"震\", \"木\", 4),  # 游魂\n    (\"泽雷随\", \"随\", \"兑\", \"震\", \"震\", \"木\", 3),   # 归魂\n    # 巽宫（木）\n    (\"巽为风\", \"巽\", \"巽\", \"巽\", \"巽\", \"木\", 6),\n    (\"风天小畜\", \"小畜\", \"巽\", \"乾\", \"巽\", \"木\", 1),\n    (\"风火家人\", \"家人\", \"巽\", \"离\", \"巽\", \"木\", 2),\n    (\"风雷益\", \"益\", \"巽\", \"震\", \"巽\", \"木\", 3),\n    (\"天雷无妄\", \"无妄\", \"乾\", \"震\", \"巽\", \"木\", 4),\n    (\"火雷噬嗑\", \"噬嗑\", \"离\", \"震\", \"巽\", \"木\", 5),\n    (\"山雷颐\", \"颐\", \"艮\", \"震\", \"巽\", \"木\", 4),   # 游魂\n    (\"山风蛊\", \"蛊\", \"艮\", \"巽\", \"巽\", \"木\", 3),   # 归魂\n    # 坎宫（水）\n    (\"坎为水\", \"坎\", \"坎\", \"坎\", \"坎\", \"水\", 6),\n    (\"水泽节\", \"节\", \"坎\", \"兑\", \"坎\", \"水\", 1),\n    (\"水雷屯\", \"屯\", \"坎\", \"震\", \"坎\", \"水\", 2),\n    (\"水火既济\", \"既济\", \"坎\", \"离\", \"坎\", \"水\", 3),\n    (\"泽火革\", \"革\", \"兑\", \"离\", \"坎\", \"水\", 4),\n    (\"雷火丰\", \"丰\", \"震\", \"离\", \"坎\", \"水\", 5),\n    (\"地火明夷\", \"明夷\", \"坤\", \"离\", \"坎\", \"水\", 4),  # 游魂\n    (\"地水师\", \"师\", \"坤\", \"坎\", \"坎\", \"水\", 3),   # 归魂\n    # 艮宫（土）\n    (\"艮为山\", \"艮\", \"艮\", \"艮\", \"艮\", \"土\", 6),\n    (\"山火贲\", \"贲\", \"艮\", \"离\", \"艮\", \"土\", 1),\n    (\"山天大畜\", \"大畜\", \"艮\", \"乾\", \"艮\", \"土\", 2),\n    (\"山泽损\", \"损\", \"艮\", \"兑\", \"艮\", \"土\", 3),\n    (\"火泽睽\", \"睽\", \"离\", \"兑\", \"艮\", \"土\", 4),\n    (\"天泽履\", \"履\", \"乾\", \"兑\", \"艮\", \"土\", 5),\n    (\"风泽中孚\", \"中孚\", \"巽\", \"兑\", \"艮\", \"土\", 4),  # 游魂\n    (\"风山渐\", \"渐\", \"巽\", \"艮\", \"艮\", \"土\", 3),   # 归魂\n    # 坤宫（土）\n    (\"坤为地\", \"坤\", \"坤\", \"坤\", \"坤\", \"土\", 6),\n    (\"地雷复\", \"复\", \"坤\", \"震\", \"坤\", \"土\", 1),\n    (\"地泽临\", \"临\", \"坤\", \"兑\", \"坤\", \"土\", 2),\n    (\"地天泰\", \"泰\", \"坤\", \"乾\", \"坤\", \"土\", 3),\n    (\"雷天大壮\", \"大壮\", \"震\", \"乾\", \"坤\", \"土\", 4),\n    (\"泽天夬\", \"夬\", \"兑\", \"乾\", \"坤\", \"土\", 5),\n    (\"水天需\", \"需\", \"坎\", \"乾\", \"坤\", \"土\", 4),   # 游魂\n    (\"水地比\", \"比\", \"坎\", \"坤\", \"坤\", \"土\", 3),   # 归魂\n]\n\n\ndef _build_hex_index():\n    \"\"\"构建卦名索引（全名 + 单字别名均可查）。\"\"\"\n    idx = {}\n    for name, alias, upper, lower, palace, palace_wx, world in _HEX:\n        rec = {\n            \"name\": name, \"alias\": alias, \"upper\": upper, \"lower\": lower,\n            \"palace\": palace, \"palace_wx\": palace_wx, \"world\": world,\n        }\n        idx[name] = rec\n        idx[alias] = rec\n    return idx\n\n\nHEXAGRAMS = _build_hex_index()\n\n\ndef find_hexagram(key):\n    \"\"\"按全名、单字别名或'上下卦'查找卦。返回卦记录 dict 或 None。\"\"\"\n    if key in HEXAGRAMS:\n        return HEXAGRAMS[key]\n    # 去空格再试\n    k = key.replace(\" \", \"\").strip()\n    if k in HEXAGRAMS:\n        return HEXAGRAMS[k]\n    return None\n","liuyao\\format.py":"\"\"\"卦盘文本格式化输出。\"\"\"\n\nfrom .board import Board\n\n\ndef yao_name(pos, yin_yang):\n    \"\"\"生成爻位名：阳爻九X，阴爻六X。\"\"\"\n    nine_six = \"九\" if yin_yang == \"阳\" else \"六\"\n    if pos == 1:\n        return \"初\" + nine_six\n    if pos == 6:\n        return \"上\" + nine_six\n    return nine_six + {2: \"二\", 3: \"三\", 4: \"四\", 5: \"五\"}[pos]\n\n\ndef format_board(board: Board) -> str:\n    \"\"\"把卦盘格式化为文本表格（上爻在上）。\"\"\"\n    out = []\n    out.append(f\"占时：{board.month_zhi}月 {board.day_gz}日（旬空：{'、'.join(board.xunkong)}）\")\n    out.append(\n        f\"主卦：{board.hexagram}（{board.palace}宫·{board.palace_wx}）\"\n        f\" → 变卦：{board.changed_hexagram or '（无）'}\"\n    )\n    moving = \"、\".join(yao_name(l.position, l.yin_yang) for l in board.moving_lines) or \"无\"\n    out.append(f\"世在{board.world_pos}爻，应在{board.response_pos}爻；动爻：{moving}\")\n    if board.yongshen_qin:\n        ys = \"、\".join(f\"{yao_name(l.position, l.yin_yang)}({l.gan}{l.zhi})\" for l in board.yongshen_lines)\n        out.append(f\"用神（{board.yongshen_qin}）：{ys}\")\n    out.append(\"\")\n\n    header = f\"{'六神':<4} {'爻位':<5} {'卦象':<5} {'六亲':<4} {'纳甲':<6} {'标注'}\"\n    out.append(header)\n    out.append(\"-\" * 60)\n\n    # 上爻在上\n    for pos in range(6, 0, -1):\n        ln = board.line(pos)\n        symbol = \"———\" if ln.yin_yang == \"阳\" else \"— —\"\n        tags = ln.label()\n        tag_str = \" \".join(tags) if tags else \"静\"\n        change = \"\"\n        if ln.is_moving and ln.change_zhi:\n            change = f\" → {ln.change_gan}{ln.change_zhi}({ln.change_qin})\"\n        out.append(\n            f\"{ln.shen:<4} {yao_name(pos, ln.yin_yang):<5} {symbol:<5} \"\n            f\"{ln.qin:<4} {ln.gan + ln.zhi + ln.wx:<6} {tag_str}{change}\"\n        )\n\n    out.append(\"-\" * 60)\n    return \"\\n\".join(out)\n","liuyao\\wuxing.py":"\"\"\"五行工具：生克关系、六亲推演、旺衰判定、十二长生、旬空、暗动/日破判定。\"\"\"\n\nfrom .data import (\n    DIZHI, DIZHI_WUXING, WUXING_SHENG, WUXING_KE, WUXING_MU,\n    SHIER_CHANGSHENG_START, SHIER_NAMES, SHIER_STRONG, SHIER_WEAK,\n    TIANGAN, XUNKONG_BY_XUN, CHONG,\n)\n\n\n# ----------------------------------------------------------------\n# 基本关系\n# ----------------------------------------------------------------\ndef sheng_me(wx):\n    \"\"\"生我者的五行（谁生 wx）。\"\"\"\n    for k, v in WUXING_SHENG.items():\n        if v == wx:\n            return k\n    return None\n\n\ndef ke_me(wx):\n    \"\"\"克我者的五行（谁克 wx）。\"\"\"\n    for k, v in WUXING_KE.items():\n        if v == wx:\n            return k\n    return None\n\n\ndef i_sheng(wx):\n    \"\"\"我生者。\"\"\"\n    return WUXING_SHENG[wx]\n\n\ndef i_ke(wx):\n    \"\"\"我克者。\"\"\"\n    return WUXING_KE[wx]\n\n\n# ----------------------------------------------------------------\n# 六亲\n# ----------------------------------------------------------------\ndef liuqin(yao_wx, palace_wx):\n    \"\"\"根据爻五行与本宫五行，返回六亲。\n\n    以本宫五行为'我'：\n        生我者 = 父母；我生者 = 子孙；克我者 = 官鬼；我克者 = 妻财；同我 = 兄弟。\n    \"\"\"\n    if yao_wx == palace_wx:\n        return \"兄弟\"\n    if sheng_me(palace_wx) == yao_wx:   # yao 生 palace → 生我者 = 父母\n        return \"父母\"\n    if i_sheng(palace_wx) == yao_wx:    # palace 生 yao → 我生者 = 子孙\n        return \"子孙\"\n    if ke_me(palace_wx) == yao_wx:      # yao 克 palace → 克我者 = 官鬼\n        return \"官鬼\"\n    if i_ke(palace_wx) == yao_wx:       # palace 克 yao → 我克者 = 妻财\n        return \"妻财\"\n    return \"兄弟\"\n\n\ndef four_gods(yongshen_wx):\n    \"\"\"以用神五行为基准，返回四神的五行。\n\n    用=本身；元=生用者(sheng_me)；忌=克用者(ke_me)；仇=克元者(=生忌者)。\n    例：用=金 → 元=土, 忌=火, 仇=木(克土生火)。\n    \"\"\"\n    yuan = sheng_me(yongshen_wx)\n    ji = ke_me(yongshen_wx)\n    chou = ke_me(yuan)  # 克元神者；亦 = sheng_me(ji) 生忌神者\n    return {\"用\": yongshen_wx, \"元\": yuan, \"忌\": ji, \"仇\": chou}\n\n\ndef yongshen_role(yao_wx, yongshen_wx):\n    \"\"\"该爻(按五行)相对用神爻(按五行)的四神角色：用/元/忌/仇/闲。\n\n    注意：以【用神爻的五行】为基准（非六亲），这才符合\"元生用、忌克用、仇克元生忌\"的定义。\n    \"\"\"\n    if yao_wx == yongshen_wx:\n        return \"用神\"\n    g = four_gods(yongshen_wx)\n    if yao_wx == g[\"元\"]:\n        return \"元神\"\n    if yao_wx == g[\"忌\"]:\n        return \"忌神\"\n    if yao_wx == g[\"仇\"]:\n        return \"仇神\"\n    return \"闲神\"\n\n\n# ----------------------------------------------------------------\n# 真空（旬空 + 当令死地）\n# ----------------------------------------------------------------\n# 真空：春土、夏金、秋木、冬火（《增删卜易·旬空章》）\n_TRUE_VOID = {\n    \"春\": \"土\", \"夏\": \"金\", \"秋\": \"木\", \"冬\": \"火\",\n}\n\n\ndef season_of(month_zhi):\n    \"\"\"月支 → 季节。四季月(辰戌丑未)返回 '季'（土当令，无真空）。\"\"\"\n    if month_zhi in (\"寅\", \"卯\"):\n        return \"春\"\n    if month_zhi in (\"巳\", \"午\"):\n        return \"夏\"\n    if month_zhi in (\"申\", \"酉\"):\n        return \"秋\"\n    if month_zhi in (\"亥\", \"子\"):\n        return \"冬\"\n    return \"季\"  # 辰戌丑未\n\n\ndef is_true_void(yao_wx, month_zhi):\n    \"\"\"爻是否为'真空'：落旬空且其五行恰为当季真空之五行。须配合 is_void 使用。\"\"\"\n    season = season_of(month_zhi)\n    return _TRUE_VOID.get(season) == yao_wx\n\n\n# ----------------------------------------------------------------\n# 旺相休囚死（按月令当令五行）\n# ----------------------------------------------------------------\ndef wuxing_state(yao_wx, ling_wx):\n    \"\"\"爻五行在当令五行(月令)下的状态：旺/相/休/囚/死。\"\"\"\n    if yao_wx == ling_wx:\n        return \"旺\"\n    if sheng_me(ling_wx) == yao_wx:   # 生令者 = 相\n        return \"相\"\n    if i_sheng(ling_wx) == yao_wx:    # 令生者 = 休\n        return \"休\"\n    if ke_me(ling_wx) == yao_wx:      # 克令者 = 囚\n        return \"囚\"\n    if i_ke(ling_wx) == yao_wx:       # 令克者 = 死\n        return \"死\"\n    return \"休\"\n\n\n# ----------------------------------------------------------------\n# 十二长生\n# ----------------------------------------------------------------\ndef shier_changsheng(yao_wx, dz):\n    \"\"\"爻五行(以地支 dz 代表位置)在十二长生中的阶段名。返回阶段名或 None。\"\"\"\n    start = SHIER_CHANGSHENG_START.get(yao_wx)\n    if start is None:\n        return None\n    start_idx = DIZHI.index(start)\n    dz_idx = DIZHI.index(dz)\n    # 地支顺行：(dz_idx - start_idx) % 12 为步数\n    step = (dz_idx - start_idx) % 12\n    return SHIER_NAMES[step]\n\n\n# ----------------------------------------------------------------\n# 爻的旺衰判定（用于暗动/日破、用神有力无力）\n# ----------------------------------------------------------------\ndef is_prosperous(yao_wx, yao_dz, month_dz, day_dz):\n    \"\"\"判断爻是否旺相。\n\n    综合月令旺相休囚死、月日生扶比和、十二长生进气。\n    旺相、得月日生、得月日比和、或处长生/冠带/临官/帝旺 → 视为旺相。\n    \"\"\"\n    month_wx = DIZHI_WUXING[month_dz]\n    day_wx = DIZHI_WUXING[day_dz]\n\n    # 1. 月令旺相\n    st = wuxing_state(yao_wx, month_wx)\n    if st in (\"旺\", \"相\"):\n        return True\n    # 2. 月生日、日生日（生扶）\n    if i_sheng(month_wx) == yao_wx or i_sheng(day_wx) == yao_wx:\n        return True\n    # 3. 月比和、日比和\n    if month_wx == yao_wx or day_wx == yao_wx:\n        return True\n    # 4. 十二长生进气（旺相阶段）\n    stage = shier_changsheng(yao_wx, yao_dz)\n    if stage in SHIER_STRONG:\n        return True\n    return False\n\n\n# ----------------------------------------------------------------\n# 旬空\n# ----------------------------------------------------------------\ndef ganzhi_index(gan, zhi):\n    \"\"\"六十甲子序号 0..59。\"\"\"\n    gi = TIANGAN.index(gan)\n    zi = DIZHI.index(zhi)\n    n = gi\n    while n % 12 != zi:\n        n += 10\n    return n  # 必在 0..59\n\n\ndef xunkong(day_gz):\n    \"\"\"由日干支(如 '辛卯')查旬空，返回两个空亡地支的元组。\"\"\"\n    g, z = day_gz[0], day_gz[1]\n    n = ganzhi_index(g, z)\n    return XUNKONG_BY_XUN[n // 10]\n\n\ndef is_void(yao_dz, day_gz):\n    \"\"\"爻地支是否落空亡。\"\"\"\n    return yao_dz in xunkong(day_gz)\n\n\n# ----------------------------------------------------------------\n# 冲\n# ----------------------------------------------------------------\ndef is_chong(a, b):\n    return CHONG.get(a) == b\n","liuyao\\__init__.py":"\"\"\"六爻排盘引擎。\n\n快速使用：\n    from liuyao import cast_board\n    board = cast_board(\"地泽临\", moving=2, month_zhi=\"未\", day_gz=\"辛卯\", yongshen_qin=\"妻财\")\n    print(board.line(2).jin_tui)   # \"化退神\"\n\"\"\"\n\nfrom .board import cast_board, Board, Line\nfrom .data import find_hexagram, HEXAGRAMS\nfrom .wuxing import xunkong, liuqin, wuxing_state, is_prosperous\nfrom .format import format_board\n\n__all__ = [\n    \"cast_board\", \"Board\", \"Line\",\n    \"find_hexagram\", \"HEXAGRAMS\",\n    \"xunkong\", \"liuqin\", \"wuxing_state\", \"is_prosperous\",\n    \"format_board\",\n]\n\n__version__ = \"0.1.0\"\n"}

const REFS_CONTENT = {"1": "# 01 · 装卦排盘\n\n排盘是断卦的根基。盘排错，后面全错。本册讲如何把一个卦\"装\"完整：定宫、定世应、纳甲、配六亲、配六神、找动爻变爻。\n\n> 实践中**优先用引擎排盘**（`python src/paipan.py …`），手工装卦仅作理解与核验。\n\n## 一、八卦基础\n\n| 卦 | 符 | 自然 | 五行 | 方位 | 阴阳 | 爻象(自下而上) |\n|---|---|---|---|---|---|---|\n| 乾 | ☰ | 天 | 金 | 西北 | 阳 | 阳阳阳 |\n| 兑 | ☱ | 泽 | 金 | 西 | 阴 | 阳阳阴 |\n| 离 | ☲ | 火 | 火 | 南 | 阴 | 阳阴阳 |\n| 震 | ☳ | 雷 | 木 | 东 | 阳 | 阳阴阴 |\n| 巽 | ☴ | 风 | 木 | 东南 | 阴 | 阴阳阳 |\n| 坎 | ☵ | 水 | 水 | 北 | 阳 | 阴阳阴 |\n| 艮 | ☶ | 山 | 土 | 东北 | 阳 | 阴阴阳 |\n| 坤 | ☷ | 地 | 土 | 西南 | 阴 | 阴阴阴 |\n\n记忆：乾三连、坤六断、震仰盂、艮覆碗、离中虚、坎中满、兑上缺、巽下断。\n\n## 二、八宫与五行\n\n六十四卦分属八宫，每宫以一个八纯卦为本宫，**宫的五行即本宫卦的五行**：\n\n| 宫 | 本宫卦 | 五行 |\n|---|---|---|\n| 乾宫 | 乾为天 | 金 |\n| 兑宫 | 兑为泽 | 金 |\n| 离宫 | 离为火 | 火 |\n| 震宫 | 震为雷 | 木 |\n| 巽宫 | 巽为风 | 木 |\n| 坎宫 | 坎为水 | 水 |\n| 艮宫 | 艮为山 | 土 |\n| 坤宫 | 坤为地 | 土 |\n\n每宫八卦由本宫卦\"变爻\"而来，顺序固定：\n\n1. **本宫卦**（八纯）\n2. **一世**：初爻变\n3. **二世**：初、二爻变\n4. **三世**：初、二、三爻变\n5. **四世**：初至四爻变\n6. **五世**：初至五爻变\n7. **游魂卦**：四爻变回本宫\n8. **归魂卦**：下卦恢复本宫\n\n**示范（乾宫）**：乾为天 →(初变) 天风姤 →(二变) 天山遁 →(三变) 天地否 →(四变) 风地观 →(五变) 山地剥 →(四回) 火地晋(游魂) →(下回) 火天大有(归魂)。\n\n> 查任意一卦属何宫、何世，最稳妥用引擎：`python src/paipan.py --hexagram 地泽临 …` 会输出宫属与世爻。手工核对可按上法逆推。\n\n## 三、世应\n\n**世爻**代表求测者自身（或所测主体），**应爻**代表对方/所测之事。世应相隔两爻（隔三位）。\n\n**世爻口诀**：\n\n| 卦类 | 世爻位置 |\n|---|---|\n| 八纯（六世） | 上爻（六爻） |\n| 一世 | 初爻 |\n| 二世 | 二爻 |\n| 三世 | 三爻 |\n| 四世 | 四爻 |\n| 五世 | 五爻 |\n| 游魂 | 四爻 |\n| 归魂 | 三爻 |\n\n应爻 = 世爻隔两爻（世初→应四，世二→应五，世三→应上，世四→应初，世五→应二，世上→应三）。\n\n> 例：地泽临为坤宫二世卦，**世在二爻，应在五爻**。\n\n## 四、纳甲（天干地支）\n\n每个卦的上下两个八卦各纳一个天干，六爻再配地支。\n\n**八卦纳干**：\n\n| 八卦 | 内卦(下) | 外卦(上) |\n|---|---|---|\n| 乾 | 甲 | 壬 |\n| 坤 | 乙 | 癸 |\n| 坎 | 戊 | 戊 |\n| 离 | 己 | 己 |\n| 震 | 庚 | 庚 |\n| 巽 | 辛 | 辛 |\n| 艮 | 丙 | 丙 |\n| 兑 | 丁 | 丁 |\n\n**地支配法**：阳卦（乾坎艮震）地支**顺行**，阴卦（坤巽离兑）地支**逆行**；阳卦配阳支序、阴卦配阴支序。完整六爻纳甲表：\n\n| 八卦 | 内卦(初/二/三) | 外卦(四/五/上) |\n|---|---|---|\n| 乾 | 甲子 甲寅 甲辰 | 壬午 壬申 壬戌 |\n| 坤 | 乙未 乙巳 乙卯 | 癸丑 癸亥 癸酉 |\n| 坎 | 戊寅 戊辰 戊午 | 戊申 戊戌 戊子 |\n| 离 | 己卯 己丑 己亥 | 己酉 己未 己巳 |\n| 震 | 庚子 庚寅 庚辰 | 庚午 庚申 庚戌 |\n| 巽 | 辛丑 辛亥 辛酉 | 辛未 辛巳 辛卯 |\n| 艮 | 丙辰 丙午 丙申 | 丙戌 丙子 丙寅 |\n| 兑 | 丁巳 丁卯 丁丑 | 丁亥 丁酉 丁未 |\n\n> 例：地泽临 = 上坤下兑。下兑内卦：初九丁巳、九二丁卯、六三丁丑；上坤外卦：六四癸丑、六五癸亥、上六癸酉。\n\n## 五、六亲\n\n以**本宫五行**为\"我\"，定六亲：\n\n| 关系 | 六亲 |\n|---|---|\n| 生我者 | 父母 |\n| 我生者 | 子孙 |\n| 克我者 | 官鬼 |\n| 我克者 | 妻财 |\n| 比和者（同我） | 兄弟 |\n\n**示范（坤宫，我=土）**：火生土→父母；土生金→子孙；木克土→官鬼；土克水→妻财；土同土→兄弟。\n\n故地泽临（坤宫）六亲：丁巳火=父母、丁卯木=官鬼、丁丑土=兄弟、癸亥水=妻财、癸酉金=子孙。\n\n## 六、六神（神煞）\n\n以**日干**起，六神固定顺序为：青龙→朱雀→勾陈→螣蛇→白虎→玄武，从**初爻**起逐爻上行。\n\n**日干起例**：\n\n| 日干 | 初爻起 |\n|---|---|\n| 甲、乙 | 青龙 |\n| 丙、丁 | 朱雀 |\n| 戊 | 勾陈 |\n| 己 | 螣蛇 |\n| 庚、辛 | 白虎 |\n| 壬、癸 | 玄武 |\n\n六神性情：青龙主喜庆桃花；朱雀主口舌是非消息；勾陈主拖延牵缠旧事；螣蛇主虚惊怪异纠缠；白虎主血光凶险刚猛；玄武主暗昧隐私欺骗。\n\n> 例：辛卯日，庚辛起白虎于初爻。地泽临：初九白虎、九二玄武、六三青龙、六四朱雀、六五勾陈、上六螣蛇。\n\n## 七、动爻与变卦\n\n- **动爻**：占卦时老阳（⃝）或老阴（✕）之爻，主变化。阳动变阴，阴动变阳。\n- **变卦**：动爻阴阳改变后所得的新卦。一卦可有多个动爻，皆变。\n- 动爻之\"变\"产生：化进化退、化空化破、化回头生克、化墓等（见 `05-进退神化.md`）。\n\n> 例：地泽临九二（阳）动，变阴，下卦兑(☱)变震(☳)，全卦成地雷复。九二丁卯动化复卦六二庚寅。\n\n---\n\n排盘至此完成。下一步进入**取用神**（见 `02-用神取用.md`）。\n", "2": "# 02 · 用神取用\n\n**用神**是全卦核心——所占之事对应的那个六亲爻。取对用神，断卦方向才对；取错，旺衰断得再细也白费。\n\n## 一、六亲对应的占事\n\n| 六亲 | 主占之事 |\n|---|---|\n| **父母** | 父母长辈、祖业、文书、契约、学历、考试、房屋、土地、车辆、舟车、衣物、雨、辛劳 |\n| **兄弟** | 兄弟姐妹、同辈朋友、合伙人、竞争者、劫财破财之事、同僚 |\n| **子孙** | 子女晚辈、下属、学生、医药（治病看子孙）、福神、僧道、宠物、六畜、娱乐、解忧之神（子孙克制官鬼，主消灾） |\n| **妻财** | 妻子、女友、钱财、财物、粮食、收成、佣人、晴（测天看财为晴） |\n| **官鬼** | 丈夫、男友、官职、工作、功名、领导、盗贼、忧虑、疾病、官非、雷霆、雷电 |\n\n## 二、常用取法\n\n| 占问 | 用神 |\n|---|---|\n| 占父母/长辈吉凶 | 父母 |\n| 占子女/晚辈 | 子孙 |\n| 占夫妻（男占妻、女占夫） | 男看妻财，女看官鬼 |\n| 占恋爱对象（男占女/女占男） | 同上：男看妻财，女看官鬼 |\n| 占财运、求财、生意 | 妻财（辅看子孙为财源） |\n| 占考试、求职、升迁、官运 | 官鬼（功名）+ 父母（文书） |\n| 占疾病 | 官鬼为病（也看子孙为医药、为解神） |\n| 占官司、官非 | 官鬼 |\n| 占失物、盗贼 | 官鬼（贼）+ 妻财（物） |\n| 占行人、出行 | 看应爻或用神（行人之爻视关系定） |\n| 占合伙、竞争 | 兄弟 |\n| 占盖房、买房 | 父母（房屋） |\n| 占他人、泛占某事无特定六亲 | 应爻 |\n\n## 三、用神与世、应的关系\n\n- **世爻** = 求测者自己（自占吉凶以世爻为主体）。\n- **应爻** = 对方 / 所测的对象或事。\n- **用神临应爻**：用神与应爻重叠，指向明确，是好事——说明所测之人/事与用神一致。\n- **用神与世爻的生克**决定吉凶方向：\n  - 用神**生世**、**合世** → 有利、旺我、吉。\n  - 用神**克世**、**冲世** → 耗损、压力、不吉（除非占官鬼求官等用神本宜克我之类）。\n  - 世爻**生用神** → 自己付出、费力。\n  - 世爻**克用神** → 自己克制所测之物。\n\n## 四、用神不上卦（伏神）\n\n若所占用神在主卦六爻中**没有出现**（不在卦上），称为\"用神不上卦\"，需寻**伏神**：\n\n- 在本宫八纯卦（首卦）中找到该六亲所在之爻，即为伏神，伏于主卦某爻之下。\n- 飞神 = 主卦上承载伏神的那个爻。\n- 伏神要\"得出\"（飞神空、破、被克，或日月生扶伏神）才能成用；若伏神被飞神压制、且衰弱无气，则所求难遂。\n\n> 实务中用神不上卦多主事情不顺、所求之人或事目前缺位或难现。引擎目前以显用神为主；伏神需手工详参。\n\n## 五、取用神的关键提醒\n\n1. **先定占什么事，再定用神**——同一卦，问财与问病用神不同。\n2. **用神取定后，全卦围绕它转**：旺衰看它、生克看它、应期看它。\n3. **勿把应爻当用神混用**——应爻是\"对方这个位置\"，用神是\"所占之事对应的六亲\"。二者重合时最清晰，不重合时要分清（比如男占女友，用神是妻财爻，而应爻可能是女友也可能是别人，以妻财为准）。\n4. 占**自身整体吉凶**、**谋事成败**无特定对象时，以**世爻**为主来看。\n\n---\n\n取好用神后，下一步看**用神旺衰**（见 `03-旺衰月日.md`）。\n", "3": "# 03 · 旺衰月日\n\n**月建、日辰**是六爻旺衰的主宰，称为\"天时\"。一个爻（用神或世爻）是有力还是无力，主要看它在月建、日辰下得不得生扶。\n\n> 关键认知：**旺衰决定\"有没有力\"，生克关系决定\"吉凶方向\"**——二者分开论。\n\n## 一、月建与日辰\n\n- **月建**：占卦当月的地支（如乙未月，月建为未）。主一月之令，定一月内的旺衰大格局。\n- **日辰**：占卦当日的天干地支（如辛卯日，日辰为卯）。主当日之令，冲合生克即时应验。\n- 月、日**同权**，都是最高主宰，卦中任何爻都受其制约。\n\n## 二、五行旺相休囚死（按月令）\n\n以月令当令的五行为基准：\n\n- 当令者 **旺**（最强）\n- 生当令者 **相**（次旺）\n- 当令所生者 **休**（休养，偏弱）\n- 克当令者 **囚**（被困，弱）\n- 当令所克者 **死**（最弱）\n\n| 月令(当令) | 旺 | 相 | 休 | 囚 | 死 |\n|---|---|---|---|---|---|\n| 寅卯(木) | 木 | 火 | 水 | 金 | 土 |\n| 巳午(火) | 火 | 土 | 木 | 水 | 金 |\n| 申酉(金) | 金 | 水 | 土 | 火 | 木 |\n| 亥子(水) | 水 | 木 | 金 | 土 | 火 |\n| 辰戌丑未(土) | 土 | 金 | 火 | 木 | 水 |\n\n> 例：未月属土（四季月土当令），土旺、金相、火休、木囚、**水死**。故未月占卦，水爻（如妻财亥水）处\"死\"地，偏弱。\n\n## 三、十二长生\n\n五行在十二地支中的生命周期：长生→沐浴→冠带→临官→帝旺→衰→病→死→墓→绝→胎→养。\n\n| | 长生 | 沐浴 | 冠带 | 临官 | 帝旺 | 衰 | 病 | 死 | **墓** | 绝 | 胎 | 养 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| 木 | 亥 | 子 | 丑 | 寅 | 卯 | 辰 | 巳 | 午 | **未** | 申 | 酉 | 戌 |\n| 火 | 寅 | 卯 | 辰 | 巳 | 午 | 未 | 申 | 酉 | **戌** | 亥 | 子 | 丑 |\n| 金 | 巳 | 午 | 未 | 申 | 酉 | 戌 | 亥 | 子 | **丑** | 寅 | 卯 | 辰 |\n| 水 | 申 | 酉 | 戌 | 亥 | 子 | 丑 | 寅 | 卯 | **辰** | 巳 | 午 | 未 |\n\n（土与火同长生，墓在辰。）\n\n十二长生中**长生、临官、帝旺**为进气旺相；**衰、病、死、墓、绝**为退气衰弱；**冠带、胎、养**为过渡。\n\n> 例：金长生于巳，到未为**冠带**（进气），到酉为帝旺。故子孙酉金在未月得进气而旺相——这是\"暗动\"判定的依据之一。\n\n## 四、月、日对爻的作用\n\n| 月/日对爻的关系 | 影响 |\n|---|---|\n| 生爻（月/日生该爻） | 生扶，增力，旺 |\n| 比和（月/日与爻同五行） | 助力，旺 |\n| 克爻 | 克制，减力，衰 |\n| 爻生月/日（泄气） | 爻之力量外泄，减力 |\n| 爻克月/日（耗力） | 爻费力去克，减力 |\n| 月冲爻 | **月破**（见 04） |\n| 日冲爻 | **暗动**或**日破**（看旺衰，见 04） |\n| 月/日合爻 | 合住（绊住不动）或合起（助旺），见 06 |\n\n## 五、判断用神/世爻旺衰\n\n综合看：\n1. **得月日生扶（生、比和）→ 旺**，有力，能成事、能受生克他人。\n2. **被月日克制（克、冲、泄、耗）→ 衰**，无力，事难成、自身不济。\n3. 月衰日扶 / 月扶日衰 → 扯平偏看主次，或看动爻与卦内生克补益。\n\n## 六、关键辨析：贵 ≠ 旺（重要）\n\n爻的**位置**（贵贱）与**旺衰**（力量）是两个维度：\n\n- **贵**：爻所处爻位决定地位。**五爻为君位**（九五之尊），主地位尊显、显要、被重视；初爻为卑位。\n- **旺**：力量强弱，由**月日生克**决定，与爻位无关。\n\n**临五爻君位 ≠ 力量强旺。** 一个爻可以\"贵而暂弱\"（位高但当下受月日制压、能量不足），也可以\"贱而得令\"（位低却当令旺相）。\n\n> 例：妻财亥水临五爻君位（贵），但未月水死、受克受泄（衰）→ **贵而暂弱**：对象本身好、缘分分量重，但眼下能量没出来。断卦时不可因\"临君位\"就断\"力强\"。\n\n## 七、旺衰的实务含义\n\n- 用神**旺相**：所占之事有力、易成、对方有力、财运佳。\n- 用神**衰弱**：所占之事无力、难成、对方冷淡、缘淡财薄（但不等于凶，要看生克方向与有无救应）。\n- **旺而受克** 仍有抵抗之力；**衰而受克** 则雪上加霜。\n- 应期上：**用神衰，待当令之月而旺**（如亥水衰，待亥子月旺）。\n\n## 八、爻临日建 / 月建的特权与限制\n\n爻之地支与日辰同 → **临日建**；与月建同 → **临月建**。临日月者旺相之极，特权极大：\n\n- **临日建**：逢月冲不破、月克无伤、动爻之克不为害、化回头克亦不为殃（**均指单克、单冲**）。似与月建同权。\n- **临月建**：当月之内逢克不伤、逢冲不破（一月主宰）。\n\n**但有限制——\"寡不敌众\"**：临日建者，若**月建 + 卦中动爻同来克**（生少克多），则破亦为破、伤亦为伤。即如酉月卯日占、爻临卯木，单论\"逢破不破\"；但若卦中又动出申酉金、或卯爻动化申酉，便是群克围攻，破仍破、伤仍伤。\n\n> 通则：**临日月建可扛单克单冲，扛不住月建+动爻的群克**。断\"临日建不破\"时，务必检查是否同时遭月建与动爻合围。\n\n---\n\n旺衰定了力，下一步看**动静、暗动、空破**这些\"动作与障碍\"（见 `04-动静暗破.md`）。\n", "4": "# 04 · 动静暗破\n\n旺衰定了\"有没有力\"，本册讲\"动不动、被不被破坏\"——这是事情能否发动、有无阻碍的关键。**其中\"暗动 vs 日破\"是最易判错、也最影响结论的一处。**\n\n## 一、动静\n\n- **动爻（明动）**：占得老阳(☰⃝)/老阴(☓)之爻，主动变化，力量显明，主事情有变。动则有化（见 05）。\n- **静爻**：少阳/少阴之爻，安静不动，被动受生克。静爻本不能主动生克他爻——**除非被日辰冲起而为\"暗动\"**。\n\n## 二、月破\n\n**月建所冲之爻为月破。**\n\n地支相冲：子午冲、丑未冲、寅申冲、卯酉冲、辰戌冲、巳亥冲。\n\n> 例：未月，未冲丑，故**丑为月破**；卯月，卯冲酉，酉为月破。\n\n- 月破之爻**一月之内无力、衰败、被破坏**，主散、主败、主落空。\n- 月破是**暂时**的——过月（出月）即恢复，不等于永久无用。\n- 忌神月破为吉（阻力被破），用神/元神月破为凶（无力生扶）。\n- 爻若本身旺相而被月冲，仍论月破，但因有根基，过月即复，损害较轻。\n\n## 三、日破 与 暗动（核心）\n\n**日辰所冲之静爻**，分两种命运，判据是该爻**旺衰**：\n\n### ⭐ 暗动（旺相逢冲）\n**静爻旺相 + 被日辰冲 = 暗动。**\n\n- 旺相 = 得月建生扶/比和/进气（相、旺、长生、临官、帝旺、冠带等）。\n- 暗动之爻**等同于发动**，能生克他爻，**有用**。\n- \"暗\"主不知不覚、隐秘、暗中。暗动主**暗中发力、暗中有人相助**。\n- **元神（生用神者）暗动** → 暗中生助用神，**吉**。\n- **忌神（克用神者）暗动** → 暗中克损用神，**凶**。\n- 判暗动时**务必先辨该爻是元神还是忌神**，方能定吉凶。\n\n### 日破（衰逢冲）\n**静爻休囚衰弱 + 被日辰冲 = 日破（冲散）。**\n\n- 衰弱 = 月克月泄月耗、死绝病衰墓等退气。\n- 日破之爻**被冲散、无用**，主败、主散、主不成。\n\n### 判定流程\n```\n静爻被日冲 → 爻旺相吗？\n                 是 → 暗动（有用，能生克他爻）\n                 否（休囚衰）→ 日破（无用，冲散）\n```\n\n> **经典例（本项目验证卦例）**：子孙酉金，未月（未土生金，金相、冠带进气，旺相），逢卯日冲 → **暗动**，非日破。作为元神暗中生助妻财亥水（金生水），是卦中隐性托底之力——主长辈介绍人暗中撮合。**若误判为日破，结论将完全相反。**\n\n## 四、空亡（旬空）\n\n**以日辰查\"旬空\"**：日干支所属的那一旬中，不出现的两个地支即空亡。\n\n### 旬空表\n| 旬 | 空亡 |\n|---|---|\n| 甲子旬 | 戌、亥 |\n| 甲戌旬 | 申、酉 |\n| 甲申旬 | **午、未** |\n| 甲午旬 | 辰、巳 |\n| 甲辰旬 | 寅、卯 |\n| 甲寅旬 | 子、丑 |\n\n> 查法：日干支在哪一旬，该旬空两个地支。如辛卯日属甲申旬，空**午、未**。\n\n### 空亡的论法\n1. **日月建本身不以空论**——月建、日辰是主宰，不空。只看**卦中之爻**是否落空亡。\n2. **卦中爻空**：\n   - **旺相之爻空 = 假空**（旺不为真空），待出空/填实即有用。\n   - **衰弱之爻空 = 真空/空而不实**，主虚浮、落空、不实、不成。\n   - **真空的具体季节**（《增删卜易》）：**春土、夏金、秋木、冬火**为真空——当季处死地又落旬空，到底全空；四季月（辰戌丑未，土当令）无真空。例：秋月（申酉）木爻落空为真空，冬月（亥子）火爻落空为真空。引擎以 `is_true_void` 判定。\n3. **动而化空**：动爻变出空亡之爻，主事将成而落空，或暂时不能落实，待填实。\n4. **空而逢冲 / 逢合 / 填实**：空亡之爻遇冲（冲空）、遇同地支之日（填实/出空）则空解，恢复作用。\n5. 用神空：所占之事当下不实、未到位、暂虚；忌神空则祸未发，反吉。\n\n> **实务要点**：先查**卦中六爻地支是否落旬空**。若卦中无落空之爻，则空亡不构成主要矛盾——这是常被忽略却很重要的一步（很多人见\"旬空\"就大谈空亡，实际卦中无爻落空，影响为零）。\n\n## 五、速查：动静暗破汇总\n\n| 状态 | 条件 | 含义 |\n|---|---|---|\n| 明动 | 占得老阳/老阴 | 显性变化，能生克他爻，有化 |\n| 暗动 | 静爻旺相 + 日冲 | 隐性发动，有用，暗中发力 |\n| 日破 | 静爻衰弱 + 日冲 | 冲散无用，主败 |\n| 月破 | 月建所冲 | 一月内衰败无用，过月可复 |\n| 空亡(假) | 旺爻落旬空 | 暂空，填实则有用 |\n| 空亡(真) | 衰爻落旬空 | 虚浮不实，主落空 |\n\n---\n\n动静空破定了有无阻碍，下一步看动爻的**变化**（见 `05-进退神化.md`）。\n", "5": "# 05 · 进退神化\n\n动爻必变，变出之爻（变爻/化神）与动爻的关系，决定了动爻力量的增减与事情的进退走向。\n\n## 一、化进神 / 化退神（同五行地支）\n\n动爻与变爻为**同五行**的地支时，论进退神（看地支在该五行序列中的进退方向）。\n\n| 五行 | 进神（前进） | 退神（后退） |\n|---|---|---|\n| 木 | 寅 → 卯 | 卯 → 寅 |\n| 火 | 巳 → 午 | 午 → 巳 |\n| 金 | 申 → 酉 | 酉 → 申 |\n| 水 | 亥 → 子 | 子 → 亥 |\n| 土 | 丑 → 辰 → 未 → 戌 | 戌 → 未 → 辰 → 丑 |\n\n（土按四库顺序，丑→辰→未→戌为进，反之为退。）\n\n- **化进神**：力量增益、前进、发展、壮大、越动越好。\n- **化退神**：力量减退、后退、退缩、衰减、越动越弱，主退意、放弃、势微。\n\n> **经典例**：世爻丁卯木动，化庚寅木。卯→寅为**退神**。世爻动而化退，主自身力量减退、心气在退、有打退堂鼓之意。\n\n**进退神只论同五行地支。** 若动爻与变爻五行不同（如木变金），不论进退，而论回头生克（见下）。\n\n## 二、化回头生 / 化回头克\n\n变爻（化神）回头作用于动爻本身：\n\n| 关系 | 名称 | 含义 |\n|---|---|---|\n| 变爻**生**动爻 | 化回头生 | 得生扶，力量增强，吉（用神化回头生尤吉） |\n| 变爻**克**动爻 | 化回头克 | 受克制，力量受损，凶（用神化回头克主事败） |\n| 变爻与动爻**同五行但非进退**（如寅化寅） | 化比和 | 力量维持，无明显增减 |\n\n> 例：寅木动化酉金——金克木，为**化回头克**，木爻受损，主事情反而变糟。\n> 例：寅木动化子水——水生木，为**化回头生**，木爻得生扶，主事情得助。\n\n## 三、化空 / 化破 / 化墓\n\n变爻本身的状态也会影响动爻的成败：\n\n- **化空**：变爻落旬空。动而化空，主事将有变却落空、暂时不能落实，待变爻填实（出空之日/月）方成。用神化空多主虚象、暂不成。\n- **化破**：变爻为月破或日破。动而化破，主变出之物无用、事将变而复败。\n- **化墓**：变爻入墓（见 07）。动而化墓，主事被收藏困束，待冲墓方出。\n\n> 三者共同含义：**动爻虽动，但变爻本身残缺/落空/被困，则变化不能落实**，事情多中途有变或暂不能成，须待变爻得救（填实/出破/出墓）。\n\n## 四、动爻变化的实务判读\n\n排盘后看每个动爻，依次问：\n\n1. 变爻与动爻**同五行**吗？\n   - 是 → 论**进神/退神**（增力或减力）。\n   - 否 → 论**回头生/回头克/比和**。\n2. 变爻**本身空、破、入墓**吗？\n   - 是 → 变化不能落实，待救应。\n3. 综合：动爻是**越动越好**（化进/化回头生/变爻旺实）还是**越动越差**（化退/化回头克/化空破墓）。\n\n## 五、动爻吉凶速查\n\n| 动爻变化 | 趋势 |\n|---|---|\n| 化进神 / 化回头生 / 化旺 | 越动越好，增益、前进 |\n| 化退神 / 化回头克 / 化衰 | 越动越差，减退、受损 |\n| 化空 / 化破 / 化墓 | 变化不能落实，暂不成，待救 |\n| 化比和 | 维持现状 |\n\n---\n\n动爻变化定了\"走向\"，下一步看**合力**（见 `06-三合六合.md`）。\n", "6": "# 06 · 三合六合\n\n\"合\"主和合、牵绊、聚集。合能把分散的力量聚成一股（三合成局），也能把爻绊住不动（合住）。合与冲相对：冲主动荡散开，合主聚集纠缠。\n\n## 一、三合局\n\n三合局由三个地支合成一股五行之力：\n\n| 三合 | 化局 | 中神 |\n|---|---|---|\n| 申 · 子 · 辰 | 水局 | 子 |\n| 亥 · 卯 · 未 | 木局 | 卯 |\n| 寅 · 午 · 戌 | 火局 | 午 |\n| 巳 · 酉 · 丑 | 金局 | 酉 |\n\n（每局由\"长生·帝旺·墓库\"三支组成，中神为帝旺之支。）\n\n### 成实局的条件（《增删卜易》主流严格标准）\n三合要论为**实成之局**（合力大、能化、可作决定性力量），须满足以下任一：\n1. **三爻齐动**：卦中三支皆为动爻。\n2. **两动一静**：两动爻 + 一静爻（或以内/外卦动变凑合），且中神旺相。**一爻明动、一爻暗动，亦作两爻动**（暗动之爻可参与成局）。\n3. **内外卦动变凑局**：通过动变使三支到位。\n\n**关键：单爻独动、仅借月建/日辰凑合者，不得论实局**，只能作下述\"虚合待用\"。\n\n### ⭐ 虚合待用局（最易判错）\n当三支中**只有一爻（或零爻）是卦内动爻**，其余靠**月建、日辰**（月日非卦内爻、本身不动）凑齐时：\n\n- **不是实成三合局**，是\"虚一待用\"之合。\n- 只能作**牵绊、纠缠之象**的辅助参考（合的意向在，故主有牵连、不易立刻断），**不可断\"局已成、合化生世/克世\"的决定性旺力**。\n- 须**待流月/流日填实**（缺失之支当令、或卦中再有动爻加入）方能真正发力成局。\n- 断长期格局时，**勿把虚合的牵绊力度放大**为实局的合力。\n\n### 实成三合局的含义（须先满足成局条件）\n- 合力**大而专一**，化出之五行力量强，相当于一个强大的该五行之爻。\n- 主**聚集、合伙、牵绊、纠葛**；合局之五行若为用神所需则大吉，为忌神则大凶。\n- 合局也主**缠绵、拖延**（合住之意）。\n\n> **经典例（本项目卦例）**：用神亥水（五爻·静）+ 世爻卯木（二爻·动）+ 月建未土。三支亥卯未齐备，但**仅世爻卯一爻独动**，亥为静爻、未是月建（非卦内爻）。\n>\n> ⚠️ **据此只可论\"虚一待用之合\"**，不可断\"三合木局已成、合力聚世\"。正确表述：有合的牵绊意向（缘分支在、有牵连，不至立刻断绝），但未成实局，须待填实（如亥子月水生木、或再有动爻加入）方真正发力。化向为木（官鬼），即便成局也带压力，非纯益。\n\n## 二、六合（地支六合）\n\n相邻地支两两相合：\n\n| 六合 | 化气（参考） |\n|---|---|\n| 子 · 丑 | 土 |\n| 寅 · 亥 | 木 |\n| 卯 · 戌 | 火 |\n| 辰 · 酉 | 金 |\n| 巳 · 申 | 水 |\n| 午 · 未 | 火（或土） |\n\n### 六合的两种作用\n1. **合住（绊）**：爻被合住则**不能动**，主拖延、羁绊、停顿、纠缠不清。动爻被合则不能动弹（须冲开方动）。\n2. **合起（助）**：衰爻逢合得助，或合化为旺相之五行而增力。\n\n### 六合含义\n- 主**和合、亲近、牵连**。\n- 占姻缘见合为吉（主和合亲近）；占谋事见合住则主拖延不动。\n- 用神与世爻相合 → 双方亲近、缘分深。\n- 忌神与用神相合 → 忌神被绊住，暂不克用神，反吉（但合解则克复发）。\n\n## 三、合与冲的实务\n\n| | 主 | 含义 |\n|---|---|---|\n| 三合 | 聚集化一 | 合力大、专一、牵绊、合伙 |\n| 六合 | 两两和合 | 亲近、绊住、拖延 |\n| 冲（六冲） | 散开动荡 | 变动、冲突、散、破 |\n\n- **合逢冲则散**：合局/六合遇冲则解开（合住之爻遇冲则能动了；合局遇冲则散）。\n- **冲逢合则止**：相冲之爻遇合则冲突暂止。\n- 占事喜合忌冲（多数情况下，合主成、冲主变），但**合未必皆吉**（合住用神反主迟滞），**冲未必皆凶**（冲开墓库、冲散忌神反吉）——要看合/冲作用在谁身上、对用神有利还是有害。\n\n## 三·补、六合六法 / 六冲六法 / 爻冲五类\n\n### 六合的六种情形（《增删卜易·六合章》）\n1. **日月合爻**：如丑月占，世爻子水与月建作合。\n2. **爻与爻合**：两动爻相合（须两爻皆动，一爻不动不为合）。\n3. **爻动化合**：动爻化出之爻与本身作合（化扶）。\n4. **卦逢六合**：内外六爻自相和合（六合卦，不动亦是）。\n5. **六冲变六合**：六冲卦变六合卦。\n6. **六合变六合**：六合卦变六合卦。\n\n**合的四态**：静逢合＝**合起**（休囚逢合亦有旺意）；动逢合＝**合绊**（绊住不能动）；爻与爻合＝**合好**（他来合我、相助）；爻动化合＝**化扶**（得扶助）。\n\n### 六冲的六种情形（《增删卜易·六冲章》）\n1. **日月冲爻**。2. **卦逢六冲**（六冲卦）。3. **六合变六冲**。4. **六冲变六冲**。5. **动爻变冲**。6. **爻与爻冲**。\n\n冲主**散**：占凶事宜冲散，占吉事不宜。须兼用神——用神旺虽冲不碍，用神失陷则凶上加凶。**六合卦变六冲，用神纵旺亦始吉终凶**（有头无尾）。\n\n### 爻冲五类\n- **月冲 ＝ 月破**。\n- **静爻旺逢日冲 ＝ 暗动**。\n- **休囚逢日冲 ＝ 日破**。\n- **动爻自化回头冲 ＝ 如逢仇敌**。\n- **爻与爻冲 ＝ 相击**。\n\n## 四、速查\n\n| 现象 | 典型含义 |\n|---|---|\n| 三合成局（用神所需） | 大助，事成力强 |\n| 三合成局（忌神） | 大忌，合力为害 |\n| 三合牵绊 | 事纠缠不散、合伙 |\n| 六合（用世相合） | 缘深、亲近 |\n| 六合绊住动爻 | 拖延、不动，待冲开 |\n| 六冲 | 变动、散、破 |\n\n---\n\n合力定了\"聚散\"，下一步看**墓库**（见 `07-墓库论.md`），它是\"被困与归藏\"的特殊状态。\n", "7": "# 07 · 墓库论\n\n\"墓库\"是爻的一种特殊状态——力量被封存、被收藏、暂不能发挥作用。本次项目验证卦例中，世爻\"入未墓\"是核心病灶之一；而\"入空墓\"与\"出墓\"的细节，是常被忽略却关键的判读点。\n\n## 一、五行墓库\n\n每个五行都有一个\"墓库\"地支（辰戌丑未四库）：\n\n| 五行 | 墓库 | 三合局印证 |\n|---|---|---|\n| 木 | **未** | 亥卯**未** |\n| 火 | **戌** | 寅午**戌** |\n| 金 | **丑** | 巳酉**丑** |\n| 水 | **辰** | 申子**辰** |\n| 土 | 辰 | （土寄水库） |\n\n> 记忆：墓库就是该五行三合局的\"库\"那一位。\n\n> ⚠️ **墓库配属切勿搞混**（断应期、入墓时常错处）：\n> - 水 → **辰**（不是丑！丑是金墓）\n> - 金 → **丑**（不是辰）\n> - 木 → 未，火 → 戌，土 → 辰\n> 即：**亥水/子水之墓在辰**；申金/酉金之墓在丑。冲某五行之墓，要先查对该墓库地支，再论冲墓出墓的双向影响（冲墓之支可能同时克泄用神，见下\"出墓的双向\"）。\n\n## 二、爻如何\"入墓\"\n\n一个爻的五行，其墓库地支若出现在以下位置，则该爻**入墓**：\n\n1. **入月墓**：月建地支为该爻墓库。\n2. **入日墓**：日辰地支为该爻墓库。\n3. **入动墓**：卦中动爻之地支为该爻墓库。\n4. **入化墓（自化墓）**：动爻变出之爻为本身墓库。\n\n> **经典例**：世爻卯木，木墓在未；月建为未 → **世爻入月墓（未墓）**。\n\n## 三、墓库的两面：库 vs 墓\n\n| 爻的状态 | 墓库的性质 | 含义 |\n|---|---|---|\n| 爻**旺相**入墓 | 为\"**库**\"（库藏） | 有归宿、有储藏，是收束归藏，未必凶；旺者入库如宝入库 |\n| 爻**衰弱**入墓 | 为\"**墓**\"（坟墓） | 被困束、衰败、力量被封存、暂不出头 |\n\n实务中多统称\"入墓\"，主：**困束、收藏、施展不开、暂不能发挥作用、力量被封存**。\n\n## 四、关键辨析\n\n### 1. 墓库是\"收藏\"，不是\"生扶\"\n某五行之墓库（如木墓未），其本身五行仍属土。**土不生木（木克土）**。故\"未土对木\"是**墓库收藏**关系，**不是生扶助旺**——生扶木的是水（水生木）。勿把墓库当生扶。\n\n### 2. ⭐ 空墓（墓库落空亡）— 易脱之困\n若墓库地支**恰落旬空**（如未墓，而未落空亡），则：\n\n- **墓不牢、墓是虚的** → 困束带\"虚惊\"性质，**容易挣脱**，非死局。\n- 这与\"爻本身有强根（如得日辰比和）\"互相呼应：**困是暂困、可解之困**。\n\n> **经典例**：世爻卯木入未墓，而未恰落旬空（辛卯日甲申旬空午未）→ 世爻入的是**空墓**，墓不甚牢，困束带虚、易脱。故断\"暂困可解\"，非衰败死局。\n\n### 3. ⭐ 出墓（待冲）\n入墓之爻**不能自己出来**，要靠**冲墓**（冲开墓库）方能出墓、重新发挥作用：\n\n- 冲墓 = 用与墓库相冲的地支。如入未墓，待**丑**（丑未冲）冲开。\n- 出墓的时机：冲墓之**月**、之**日**，或卦中有力的冲墓之**动爻**。\n\n> **经典例**：世爻入未墓，待**丑月**（丑冲未）冲开墓库，世爻方能出墓、状态回勇、能主动发力。这与\"用神待令\"的应期常叠合。\n\n### ⭐ 冲墓的双向影响（应期辩证，勿只看利好）\n冲墓出墓虽利\"入墓之爻\"解脱，但**冲墓之支本身对其他爻（尤其用神）可能同时不利**，须双向看：\n\n- 冲未墓用的是**丑**。丑属土，**土克水**；且丑为季冬末、水气将退。\n- 故本例中，丑月虽开木墓让世爻（卯木）出墓，但对**妻财亥水**（财/她）是\"土克水 + 水气衰退\" → **财爻在丑月转弱**。\n- 结果是**时间错位**：财（感情）最旺在**亥、子月**（水当令），世爻出墓发力却偏在**丑月** → \"你状态回来时，她/感情能量已过峰值\"。断应期须点明此错位，**最佳重叠窗口在亥子月**（财旺，世爻虽未出墓但有日辰根托底），而非笼统说\"丑月发力\"。\n\n> 通则：**冲墓之支若同时克泄用神，则\"出墓利好\"与\"用神转弱\"并存**，应期当取用神得令且墓可冲的交集，而非单看一处。\n\n## 五、入墓的吉凶\n\n入墓本身是\"力量被封存\"的中性状态，吉凶看：\n\n1. **谁入墓**：\n   - 用神/世爻入墓 → 所占之事或自身被困束、暂难发挥（偏负）。\n   - 忌神入墓 → 忌神被收藏不能为害（偏正）。\n2. **旺衰**：旺入库（有藏有出），衰入墓（衰败被困）。\n3. **是否空墓**：空墓易脱，损害轻、可解。\n4. **能否出墓**：有冲墓之机则终能出，事有转机；无则长期困顿。\n\n## 六、速查\n\n| 状态 | 含义 |\n|---|---|\n| 旺爻入墓 | 入库，归藏，有出 |\n| 衰爻入墓 | 入墓，困束，衰败 |\n| 入空墓 | 墓虚，困束易脱，非死局 |\n| 待冲出墓 | 冲墓之月/日出墓发力 |\n| 忌神入墓 | 忌神不能为害，反吉 |\n\n---\n\n至此，断卦所需的所有\"零件\"（用神、旺衰、动静暗破、化变、合、墓）已齐备。下一步把它们串成**完整的断卦流程**（见 `08-断卦步骤.md`）。\n", "8": "# 08 · 断卦步骤（完整工作流）\n\n本册把前七册的技法串成一条**可重复的断卦流水线**，并用本项目验证卦例（地泽临 → 地雷复，辛卯日）完整走查一遍。\n\n## 一、八步流程\n\n```\n①排盘定盘 → ②取用神 → ③用神旺衰 → ④世爻状态\n→ ⑤查动静暗破 → ⑥查化变合墓 → ⑦综合定性 → ⑧定应期\n```\n\n| 步 | 要回答的问题 | 关键技法 |\n|---|---|---|\n| ① 排盘 | 宫属、世应、六亲、纳甲、六神、动爻变卦 | 装卦（01）；**优先用引擎** |\n| ② 取用神 | 所占之事对应哪个六亲？临不临应？ | 用神取用（02） |\n| ③ 用神旺衰 | 用神在月日下有力还是无力？ | 旺相休囚死、十二长生（03） |\n| ④ 世爻状态 | 求测者自身如何？（旺衰/入墓空破/动化） | 旺衰、墓库（03、07） |\n| ⑤ 动静暗破 | 哪些爻动？哪些暗动/月破/日破/空？ | 动静暗破（04） |\n| ⑥ 化变合墓 | 动爻怎么变？有无三合六合？谁入墓？ | 进退神化、合、墓（05、06、07） |\n| ⑦ 综合定性 | 吉凶方向？有层次、有条件地给结论 | 全部综合 |\n| ⑧ 定应期 | 何时转机/成败？ | 用神待令、出墓待冲（03、07） |\n\n## 二、每步的关键提醒\n\n- **①** 盘必须排对。动爻要找准（错一动爻全盘错）。用引擎核验。\n- **②** 先定\"占什么事\"，再取用神。用神临应最清晰。\n- **③** 记住\"旺衰≠吉凶\"——旺衰定力，生克定方向。且\"贵≠旺\"。\n- **④** 世爻是\"你自己\"，世爻退弱/入墓/化退，自身就不济，再好的外缘也接不住。\n- **⑤** **暗动 vs 日破务必看旺衰**——这是最高频的错误。空亡先查卦中爻是否落空，无则不论。\n- **⑥** 化进化退看同五行地支；回头生克看变爻对动爻；合局看聚散；墓库看困束与出墓。\n- **⑦** 结论要分层：本质（用神与世的生克方向）+ 当下（旺衰、阻碍）+ 趋势。不要一句吉凶了事。\n- **⑧** 应期要有依据：衰待令、墓待冲、空待填。\n\n## 三、完整走查：地泽临 → 地雷复（辛卯日，占家人介绍女缘是否旺己）\n\n> 占时：丙午年 乙未月 辛卯日。男占女方（家人介绍），问是否旺己。\n\n### ① 排盘定盘\n坤宫二世卦，世在二，应在五。独九二发动。\n\n| 爻 | 六神 | 六亲 | 纳甲 | 标注 |\n|---|---|---|---|---|\n| 上六 | 螣蛇 | 子孙 | 癸酉金 | 静 |\n| 六五 | 勾陈 | 妻财 | 癸亥水 | 应 |\n| 六四 | 朱雀 | 兄弟 | 癸丑土 | 静 |\n| 六三 | 青龙 | 兄弟 | 丁丑土 | 静 |\n| 九二 | 玄武 | 官鬼 | 丁卯木 | 世·动·化庚寅 |\n| 初九 | 白虎 | 父母 | 丁巳火 | 静 |\n\n- 月建未、日辰卯、旬空午未。\n- 动爻九二（阳）变阴，下卦兑→震，主卦临变复卦。\n\n### ② 取用神\n男占女方 → **妻财为用**。妻财癸亥水在五爻，**临应爻** → 用神与应重叠，指向明确，就是这个女性。\n\n### ③ 用神旺衰\n- 未月水**死**（受月建未土之克）+ 日辰卯木泄（亥生卯）→ **用神衰弱受压**。\n- 但用神**临五爻君位**（贵）→ **贵而暂弱**：对象本身好、缘分分量重，但眼下能量没出来、偏淡。\n- 用神**生世**（亥水生卯木）→ **本质旺我**，方向吉。\n\n### ④ 世爻状态\n世爻丁卯木，四重退守，**化退+入墓为双重衰败的主导**：\n- 官鬼持世（忧虑负担）\n- 入未墓（月建未为木墓，且未月木囚 → 月这一侧既衰又困束）\n- 动化退神（卯→寅，**不可逆退气大势**，是核心病灶）\n- 临玄武（暗自动摇）\n- **日辰卯为木帝旺比和**：仅作**保命底**——保元气不致断绝、使世爻属\"困中有根\"而非\"衰死\"，但**不能扭转化退大势，也不负责挣脱墓锁**（出墓靠冲墓，见⑧）。勿抬高日辰救应权重。\n\n### ⑤ 动静暗破\n- **子孙酉金**：未月土生金、金相/冠带 → **旺相**；逢日辰卯冲 → **暗动**（非日破！）。作元神**暗中生助亥水** → 隐性托底，主长辈介绍人暗中撮合。\n- **兄弟丑土**（六三、六四）：未月冲丑 → **月破**。忌神（克财）被破 → 外部竞争/破财阻力减弱（偏好）。\n- **旬空午未**：卦中六爻无落空之爻 → 空亡不构成主要矛盾（卦象实在）。世爻入之未墓落空 → **空墓**，墓不牢，困束易脱。\n\n### ⑥ 化变合墓\n- 九二**化退神**（卯→寅）：世爻力量减退、退意（不可逆退势）。\n- **三合**：亥（用神·静）·卯（世爻·动）·未（月建）。三支虽齐备，但**仅世爻一爻独动，亥静、未为月建非卦爻** → 属**虚一待用之合，非实成木局**。只可断\"有牵绊意向、缘分支在不易立刻断\"，**不可断\"木局已成、合化聚世\"**；须待填实（亥子月水生木等）方发力。\n- **六合卦**：变卦复为六合卦（初子四丑、二寅五亥、三辰上酉，三对皆合），主和合、聚拢、持久；临（非六合）变复（六合），由散转合，于姻缘为正面之象。然\"用神有气方济\"，用神亥水衰，须待旺月（亥子月）合力方显。（引擎 `board.changed_is_liuhe`）\n\n### ⑦ 综合定性\n**本质旺你**（用神生世 + 临君位）——好缘分，对象不差且分量重。（三合为虚合待用，不作决定性旺力，仅作牵绊辅助参考。）\n**当下不旺**：用神衰弱受压（感情能量弱、对方未发力）+ 世爻\"化退+入墓\"双重衰败为主导（日辰仅保命底）+ 子孙暗动暗中托底（隐性，不显）。\n→ 缘分实而时机未至、有底子却暂封存；退势为主、困中有根。宜守宜养，不宜急进亦不宜放弃。\n\n### ⑧ 定应期（须双向辩证）\n- **感情（财亥水）最佳窗口**：**亥、子月**（初冬、仲冬，水当令）——财最旺、女方最有力，且世爻虽未出墓但有日辰根托底。**这是双方相对重叠的利好窗口。**\n- **世爻出墓发力**：**丑月**（丑冲未开木墓）——利你自身状态回勇。**但注意错位**：丑月土当令克水、水气将退，财爻此时已转弱 → \"你行她退\"。\n- 故勿笼统说\"丑月发力即好转\"；**真正要把握的是亥子月**。卦变复，主慢、重新蓄力、否极泰来（七日来复）。\n\n### 结论\n好缘分、能旺你、对象不差且分量重；当下\"贵而暂弱\"、元神暗动暗中托底、世爻\"化退+入墓\"双重退守（日辰保底、非解药）——缘分实而时机未至、退势为主。**最佳窗口在亥子月**（财旺、双方较有利）；丑月你出墓但财已转弱，须防时间错位。\n\n---\n\n## 三·补、应期总注（《增删卜易·各门类应期总注章》）\n\n断卦功夫过硬，全在应期准确。下为主流应期断法集成，按主事爻（用神/世爻）状态分类——核心口诀：**静待冲值、动待合值、旺待墓冲、衰待生旺、墓待冲、合待冲、破待填、空待填冲**（缺什么补什么、被什么制待什么解）。\n\n| 主事爻状态 | 应期 | 例 |\n|---|---|---|\n| **静** | 逢值、逢冲 | 临子水不动，后逢子日(值)或午日(冲)应 |\n| **动** | 逢合、逢值 | 临子水发动，后逢子日(值)或丑日(合)应 |\n| **太旺**（多见/临月日） | 逢墓、逢冲 | 临午火又遇巳午，后逢亥子(冲)或戌(墓)应 |\n| **衰绝** | 遇生、遇旺 | 金爻休囚于巳午月，后逢土月生或秋令旺应 |\n| **入三墓** | 喜冲开 | 午火墓于戌，后逢辰日(冲戌)应 |\n| **逢合（合住）** | 宜冲开 | 子与丑合，后逢午未日(冲开)应 |\n| **月破** | 喜填合 | 子月午火月破，后逢未日(合)或午日(填实)应 |\n| **旬空** | 最爱填冲 | 空亡爻逢同支日(填实)或冲日应 |\n| **大象吉而受克** | 待克神受克 | 用神辰土旺但受寅卯克，后逢申酉(克木)日应吉 |\n| **大象凶而受克** | 防克者逢生 | 用神衰又受克，克神逢生之时凶应 |\n| **化进神** | 逢值、逢合 | 申动化酉，应申(值)月日 |\n| **化退神** | 忌值、忌冲 | 酉动化申退，应申(值)或寅(冲)月日 |\n\n### 其他应期要点\n- **元神忌神**：元神来助看用神衰旺（用衰须元旺方生得起）；忌神来克观元气兴衰（忌旺则克成、忌无力则不克）。\n- **独发独静**：间有应于卦中独发或独静之爻。\n- **变爻动爻**：如爻临戌变酉，有成日(值变爻)或酉日应。\n- **远近**：远事定年月，近事应日时；亦有占远应近、占近应远、占月应年、占日应时者。\n- **世空元动**：须待元神逢值（如甲辰旬占财得困之坎，主亥日得财）。\n- **世衰元静**：必须元气逢冲（如秋占图谋得困卦，后逢巳日成）。\n- **卦不明**：恍惚难断者，再占一卦合决，不可妄断。\n\n> 本卦例应用：用神亥水衰 → 待**亥子月（逢旺）**；世爻入未墓 → 待**丑月（冲墓）**。但须双向辩证（见走查⑧）：亥子月财旺是感情最佳窗口，丑月世出墓却财转弱，须防错位。\n\n## 四、输出规范\n\n一份合格的断卦输出应包含：\n\n1. **排盘**（表）+ 关键参数（月日空用神）。\n2. **本质判断**：用神与世爻的生克关系定大方向。\n3. **当下分析**：旺衰、动静暗破、化变合墓，逐项点明，**关键辨析处（暗动/空墓/进退）要讲清依据**。\n4. **综合定性**：分层、有条件的结论，不一刀切。\n5. **应期**：有依据的时间窗口。\n6. **理性提醒**：术数非科学，结论供参考。\n\n## 五、理性提醒\n\n六爻为传统文化与占卜术，断的是\"势、象、时机\"，非事实预测。任何决策（感情、财务、健康等）须以现实理性判断为准，占卜仅作心态与时机之参考。\n", "9": "# 09 · 用神 · 元神 · 忌神 · 仇神 · 有力无力\n\n断卦以**用神**为核心，但用神能否得生、是否被克，要看**元神、忌神是否有力**。\"见生不生\"\"虽动不克\"是六爻里极常见、也极致命的误判点——元神现了但无力，照样生不起用神；忌神动了但无力，照样克不到用神。本章把这套判定讲透。\n\n> 依据：《增删卜易·用神元神忌神仇神章》。\n\n## 一、四神定义（以用神爻五行为基准）\n\n| 神 | 定义 | 对用神的作用 |\n|---|---|---|\n| **用神** | 所占之事对应的爻 | 主体 |\n| **元神** | 生用神者（生我） | 生扶用神，吉 |\n| **忌神** | 克用神者（克我） | 克损耗用神，凶 |\n| **仇神** | 克元神、生忌神者 | 间接害用（制元助忌） |\n| 闲神 | 与用神无直接生克 | 不主事 |\n\n> 例：用神=金 → 元=土（生金）、忌=火（克金）、仇=木（克土元、生火忌）。\n> 注意以**用神爻的五行**为基准（非六亲），方符合\"元生用、忌克用、仇克元生忌\"的定义。\n\n## 二、⭐ 元神有力五条（能生用神，诸占皆吉）\n\n1. 元神**旺相**，或临日月，或得日月动爻生扶。\n2. 元神**动化回头生**、及**化进神**。\n3. 元神**长生、帝旺于日辰**。\n4. 元神**与忌神同动**（忌动则元亦动以制之，反成生用之势）。\n5. 元神**旺动，临空、化空**（旺不为空，待出空即生）。\n\n## 三、无用元神六条（虽现，不能生用，虽有如无）\n\n1. 元神**休囚不动**，或动而休囚又被伤克。\n2. 元神休囚，又逢**旬空、月破**。\n3. 元神**动化退神**。\n4. 元神**衰而又绝**。\n5. 元神**入三墓**。\n6. 元神休囚，**动化绝、化克、化破、化散**。\n\n> 要害：**\"见生不生\"**——元神现了但命中上述任一，则生不起用神，断吉要打折扣。\n\n## 四、忌神有力五条（能克用神，势同斧钺，诸占大凶）\n\n1. 忌神旺相，或遇日月动爻生扶，或临日月。\n2. 忌神动化回头生、化进神。\n3. 忌神旺动，临空、化空。\n4. 忌神长生、帝旺于日辰。\n5. 忌神与仇神同动。\n\n## 五、忌神动不克用神七条（虽动，不能克用，化凶为吉）\n\n1. 忌神休囚不动、动而休囚被日月动爻克。\n2. 忌神静，临空破。\n3. 忌神入三墓。\n4. 忌神衰，动化退神。\n5. 忌神衰而又绝。\n6. 忌神动，化绝、化克、化破、化散。\n7. **忌神与元神同动**（元神同动则制忌护用，忌神克力被化解）。\n\n## 六、用神有根是前提\n\n> **用神无根，谓之\"元神有力亦难生、忌神无力亦休喜\"。**\n\n用神本身要有气（得月生扶、临日月、有动等）。若用神自身衰绝无根，则：元神再有力也\"生不起一个死物\"；忌神虽无力，用神自己也立不住，未必就能吉。故断卦先看**用神有没有根**，再看元忌有力无力。\n\n## 七、仇神的作用\n\n仇神不直接生克用神，但它**克元神**（使元神无力生用）、**生忌神**（助忌神克用），是用神的间接大敌。断卦见仇神旺动，要警惕\"元神被制、忌神得助\"的连锁。\n\n## 八、引擎支持\n\n- `board.line.role` 返回四神角色（用/元/忌/仇/闲）。\n- 元神、忌神爻另有 `line.effective`（True 有力 / False 无力 / None 中和）与 `line.effective_reason`（理由），按上述有力/无力条件自动判定。\n- `board.yongshen_wx` 为用神爻五行基准。\n\n> 经典例（本项目卦例）：用神妻财亥水。\n> - 子孙酉金 = 元神，**旺相暗动 → effective=True「发动有力」** → 能暗中生财（长辈撮合）。\n> - 兄弟丑土 = 忌神，但**月破 → effective=False「月破无力」** → 虽是忌神却克不到财（外部阻力被破）。\n> - 父母巳火 = **仇神**（克金元、生土忌）。\n> 这正是\"元神有力则生、忌神无力则不克\"的活用——若无这套判定，易误判\"有忌神就凶\"。\n", "10": "# 10 · 卦变生克墓绝 · 反吟 · 伏吟\n\n除了\"爻变\"（动爻化进化退、回头生克），还有\"**卦变**\"层面的关系——主卦与变卦之间的整体生克、以及两种特殊的卦变之象：**反吟、伏吟**。这三者主\"事情的整体走势与反复\"。\n\n> 依据：《增删卜易·卦变生克墓绝章》《反伏章》。\n\n## 一、卦变生克（主卦宫 vs 变卦宫）\n\n看主卦所属宫的五行与变卦所属宫的五行生克：\n\n| 关系 | 含义 | 吉凶 |\n|---|---|---|\n| 变卦**生**主卦 | 变生主 | 吉 |\n| 变卦与主卦**比和**（同五行） | 变比和 | 吉 |\n| 变卦**克**主卦 | 变克主 | **凶**（不论用神衰旺皆以凶推） |\n| 主卦**生**变卦 | 主生变（泄） | 泄气，偏耗 |\n| 主卦**克**变卦 | 主克变（制） | 制变，偏利 |\n\n> 要害：原文\"凡遇卦化克者，不论用神之衰旺皆以凶推\"——变卦克主卦是大凶之象，即使用神旺也难救。\n> 经典例（本项目卦例）：地泽临（坤宫土）变地雷复（坤宫土）→ **变比和（吉）**，卦变层面无克害。\n\n## 二、反吟（卦变相冲相克）\n\n**反吟** = 卦变而呈现相冲、相克之象（动爻化出之爻与原爻地支相冲，即回头冲；典型如乾变坤）。主\"反复不安\"：\n\n- 内卦反吟 → 内（自己/家）不安；外卦反吟 → 外（他人/外境）不宁；内外反吟 → 内外皆不安。\n- 总象：**成而败、败而成，有而无、无而有，得而失、失而得**，动荡反复。\n- 各事：占功名迁来迁去；占财聚散不常；占宅欲迁不迁；占婚反复难成；占病愈而又病；占出行中途而返。\n- **救应**：用神旺相、不变冲克者，虽反吟事亦终成；若用神化回头冲克，大凶。\n\n## 三、伏吟（卦变而六爻地支五行不变）\n\n**伏吟** = 卦变了，但六爻的地支（五行）没有变（如无妄变大壮，内外卦地支全同）。主\"忧郁呻吟、停滞不伸\"：\n\n- 内外伏吟 → 内外忧郁呻吟之象。\n- 各事：占名久困宦途；占利本利消乏；占宅欲迁不能、守之不利；占婚忧而不乐；占病久病呻吟；占出行艰于动转。\n- **救应**：用神旺相，冲开之年月其志得伸；用神休囚，冲开之年月也只是忧郁稍解。\n- 伏吟较反吟稍轻（反吟有冲有克、用神受克，得祸匪轻；伏吟主停滞呻吟）。\n\n## 四、反吟 vs 伏吟 速辨\n\n| | 本质 | 主象 | 关键 |\n|---|---|---|---|\n| 反吟 | 卦变**相冲相克**（动爻化回头冲） | 反复动荡、得而复失 | 用神化回头冲克则大凶 |\n| 伏吟 | 卦变而**地支五行不变** | 停滞忧郁、呻吟不伸 | 用神旺则冲开可伸，衰则难 |\n\n## 五、引擎支持\n\n- `board.gua_bian`：卦变生克关系（\"变比和(吉)\"/\"变生主(吉)\"/\"变克主(凶)\"/\"主生变(泄)\"/\"主克变(制)\"）。\n- `board.fan_yin`：反吟检测（动爻皆化回头冲）。\n- `board.fu_yin`：伏吟检测（变卦六爻地支与主卦全同）。\n\n> 说明：反吟的完整判定（内外卦分别、卦变六冲）较繁，引擎采用\"动爻皆化回头冲\"的简化充分条件——命中则确为反吟，未命中不代表绝无反吟之象，复杂卦宜结合卦象手工详参。\n", "11": "# 11 · 六十四卦判辞（卦象与断辞速查）\n\n（共 64 卦，按八宫分组。）\n断卦时，主卦、变卦的**卦意**可参此表——每卦列「一句话卦象」与「判曰（传统断辞歌诀）」，用于快速把握卦的总体意象与吉凶倾向。\n\n> 提炼自《易经六十四卦》整理稿（判辞为传统断卦歌诀）。**六爻纳甲断法以用神旺衰生克为本，卦辞判辞为意象参考**，二者互为参证，不可只凭卦辞判辞定吉凶。\n\n> 注：各卦注记（纯卦／一世／…、六冲／六合）沿用源稿，偶有笔误；**世爻位置与六冲六合一律以引擎排盘（`paipan.py`）为准**。\n\n## 乾宫八卦——属金\n\n### 乾为天\n> （纯卦）乾上 乾下（六冲）\n\n- **卦象**：六龙御天之卦，广大包容之象。\n- **判曰**：乾者，健也。大哉乾元。荫覆无偏，玄运造化，万物资始。云行雨施。变化不言。东西任意，南北安然。\n\n### 天风姤\n> （一世）乾上 巽下\n\n- **卦象**：风云相济之卦，君臣会合之象。\n- **判曰**：姤者，遇也。以阴遇阳，以柔遇刚，本无所望，而卒然值之，不期而遇。占者得之，所谋无不吉也。\n\n### 天山遁\n> （二世）乾上 艮下\n\n- **卦象**：豹隐南山之卦，近善远恶之象。\n- **判曰**：遁者，退也。处遁之时，阳道欲亏，恶事即起，善事欲衰。欲进欲退，疑惑难为，以小制大，君子避之。\n\n### 天地否\n> （三合）乾上 坤下（ 六合）\n\n- **卦象**：天地不交之卦，人口不圆之象。\n- **判曰**：否者，塞也。天地不交，阴阳闭塞。夫妇不和，别离南北。君子道消，小人道长。人物乖违，不通之象。\n\n### 风地观\n> （四世）巽上 坤下\n\n- **卦象**：云卷晴空之卦，春花竞发之象。\n- **判曰**：观者，观也。观国之光，风在地上，万物荣昌。财不破散，爵禄加彰。\n\n### 山地剥\n> （五世）艮上 坤下\n\n- **卦象**：去旧生新之卦，群阴剥尽之象。\n- **判曰**：剥者，落也。山高岌岌，其形似剥。阴道将盈，阳道衰弱。卦临九月，霜叶凋落。人离财散，求官失爵。\n\n### 火地晋\n> （游魂）离上 坤下\n\n- **卦象**：龙剑出匣之卦，以臣遇君之象。\n- **判曰**：晋者，进也。日出于地，柔而上行，巡运照耀，升进其明。居官益位，祸灭福生，利见王侯，任意必亨。\n\n### 火天大有\n> （归魂）离上 乾下\n\n- **卦象**：金玉满堂之卦，大明中天之象。\n- **判曰**：大有者，宽也。柔得尊位，官禄日实。掩恶扬善，丰财和义，广纳包容，成物之美。自天佑之，吉无不利。\n\n## 兑宫八卦——属金\n\n### 兑为泽\n> （纯卦）兑上 兑下（六冲）\n\n- **卦象**：江湖养物之卦，天降雨泽之象。\n- **判曰**：兑者，悦也。泽润万物，恩惠兆民。居上爱下，悦而忻忻。利有攸往，无不亨贞。\n\n### 泽水困\n> （一世）兑上 坎下（六合）\n\n- **卦象**：河中无水之卦，守己待时之象。\n- **判曰**：困者，危也。水在泽下，万物不生。君子困穷，小人滥盈。三山幽谷，向暗背明。占者有难，守而勿争。\n\n### 泽地萃\n> （二世）兑上 坤下\n\n- **卦象**：鱼龙会聚之卦，如水就下之象。\n- **判曰**：萃者，聚也。内外喜悦，上下俱柔。万事蕃息，利禄悠悠。求谋有济，解释忧愁。\n\n### 泽山咸\n> （三世）兑上 艮下\n\n- **卦象**：\n- **判曰**：\n\n### 水山蹇\n> （四世）坎上 艮下\n\n- **卦象**：飞雁衔芦之卦，背明向暗之象。\n- **判曰**：蹇者，难也。利往西南，不利东北。向暗背明，多有壅塞。求事未遂，尚多疑惑。\n\n### 地山谦\n> （五世）坤上 艮下\n\n- **卦象**：地中有山之卦，仰高就下之象。\n- **判曰**：谦者，退也。谦而受益，满而受亏。谦谦君子，尊人自卑。利用谦逊，万事无违。\n\n### 雷山小过\n> （ 游魂）震上 艮下\n\n- **卦象**：\n- **判曰**：\n\n### 雷泽归妹\n> （ 归魂）震上 兑下\n\n- **卦象**：浮云蔽日之卦，阴阳不交之象。\n- **判曰**：归妹者，大也。归妹未吉，其道将穷。天地不交，闭塞不通。有殃有咎，无始无终。所作不顺。必见其凶。\n\n## 离宫八卦——属火\n\n### 离为火\n> （纯卦）离上 离下（六冲）\n\n- **卦象**：飞禽遇网之卦，大明当天之象。\n- **判曰**：离者，丽也。光明美丽，不利出师。二鸟同飞，雄失其雌，婚姻未合，易起官非。口舌相尚，财散人离。\n\n### 火山旅\n> （一世）离上 艮下\n\n- **卦象**：如鸟焚巢之卦，乐极哀生之象。\n- **判曰**：旅者，客也。长途落落，羁旅凄凄，火行山上，逐草高低。如鸟焚巢，无枝可栖。虽然先笑，后有悲啼。\n\n### 火风鼎\n> （二世）离上 巽下\n\n- **卦象**：调和鼎鼐之卦，去旧取新之象。\n- **判曰**：鼎者，定也。鼎象九州，和羹之器，变生为熟，以成香味。鼎乃易溢，不宜争事，官鬼持世，求官最利。\n\n### 火水未济\n> （三世）离上 坎下\n\n- **卦象**：竭海求珠之卦，忧中望喜之象。\n- **判曰**：未济者，失也。水火不交，刚柔失位，求事未成，多有壅滞。如狐渡水，必濡其尾。积小成大，谓之未济。\n\n### 山水蒙\n> （四世）艮上 坎下\n\n- **卦象**：人藏烟草之卦，万物始生之象。\n- **判曰**：蒙者，昧也。蒙以养正，山下有泉，回还反覆，迷闷相连。多忧过失，病患相缠，欲进欲追，疑惑不前。\n\n### 风水涣\n> （五世）巽上 坎下\n\n- **卦象**：顺水行舟之卦，大风吹物之象。\n- **判曰**：涣者，散也。逐波随水，患难将消，恶事离身，狱讼出牢。利涉大川，舟楫遥遥，出入无滞，福德滔滔。\n\n### 天水讼\n> （游魂）乾上 坎下\n\n- **卦象**：纵鹰逐兔之卦，天水相违之象。\n- **判曰**：讼者，论也。天道西往，水脉东流。求事未遂，心常怀忧。争讼宜止，可用和休。\n\n### 天火同人\n> （归魂）乾上 离下\n\n- **卦象**：游鱼从水之卦，管鲍分金之象。\n- **判曰**：同人者，亲也。同心之言，其臭如兰。二人同心，其利断金。所求皆得，无不称心。\n\n## 震宫八卦——属木\n\n### 震为雷\n> （纯卦）震上 震下（六冲）\n\n- **卦象**：震惊百里之卦，有声无形之象。\n- **判曰**：震者，动也。重雷发响，百里飞声，无事之者，愕然而惊。求谋和遂，官爵难成。空闻其响，不见其形。\n\n### 雷地豫\n> （一世）震上 坤下（六合）\n\n- **卦象**：鸾凤生雏之卦，万物发荣之象。\n- **判曰**：豫者，悦也。雷出于地，开鼓翼，天地顺动。日时不忒。先王制礼，殷荐崇德。凡事无疑，上下悦怿。\n\n### 雷水解\n> （二世）震上 坎下\n\n- **卦象**：春雷行雨之卦，忧散喜生之象。\n- **判曰**：解者，散也。出于险难，恶事消散，狱讼可释，共相歌赞。婚不和谐，人如隔面。久患在床，今当冰泮。\n\n### 雷风恒\n> （三世）震上 巽下\n\n- **卦象**：日月长明之卦，四时不忒之象。\n- **判曰**：恒者，久也。长久安静，不动为良，四时变化，天道无常。日月运转，普照其光。君子以立，不易其方。\n\n### 地风升\n> （四世）坤上 巽下\n\n- **卦象**：灵鸟翱翔之卦，显达光明之象。\n- **判曰**：升者，进也。木生于土，萌芽渐长，积小成大，升进而上，宜见王公，褒嘉欢赏。出暗向明，亨通之象。\n\n### 水风井\n> （五世）坎上 巽下\n\n- **卦象**：珠藏深渊之卦，守静安常之象。\n- **判曰**：井者，静也。邑乃可改，并不可移，安身勿动，守道无亏。所作于人，且宜修之。逃亡难得，应没还期。\n\n### 泽风大过\n> （游魂）兑上 巽下\n\n- **卦象**：寒木生花之卦，本末俱弱之象。\n- **判曰**：大过者，祸也。四阳过盛，上下不胜，栋桡之象，事卒难明。两刑两克，所求不成。枯杨借生，自灭之征。\n\n### 泽雷随\n> （归魂）兑上 震下\n\n- **卦象**：良工琢玉之卦，如水推车之象。\n- **判曰**：随者，顺也。上刚下柔，随时之义。改故鼎新，众美俱至。士子得官，宜增禄位。百事遂意，吉无不利。\n\n## 巽宫八卦——属木\n\n### 巽为风\n> （纯卦）巽上 巽下（六冲）\n\n- **卦象**：风行草偃之卦，上行下效之象。\n- **判曰**：巽者，顺也。乃顺成天，动用相尚，消息交通，无诸蔽障。恶事不同，风飘其响。所作随顺，进达之象。\n\n### 风天小畜\n> （一世）巽上 乾下\n\n- **卦象**：匣藏宝剑之卦，密云不雨之象。\n- **判曰**：小畜者，塞也。密云不雨，夫妇反覆。信息不通，出行却伏，求事不成，迟而未速。\n\n### 风火家人\n> （二世）巽上 离下\n\n- **卦象**：入海求珠之卦，开花结子之象。\n- **判曰**：家人者，同也。阴阳得位，夫妇克隆，田木增广，财入本宫。婚姻之道，以存始终。不求自合，家庆融融。\n\n### 风雷益\n> （三世）巽上 震下\n\n- **卦象**：鸿鹄遇风之卦，滴水天河之象。\n- **判曰**：益者，损也。风雷相举，益道如然。小人达情，刑狱之愆。君子位变，见善则迁。利有攸往，行人速还。\n\n### 天雷无妄\n> （四世）乾上 震下（六冲）\n\n- **卦象**：石中蕴玉之卦，守旧安常之象.。\n- **判曰**：无妄者，天灾也。天雷震响，惊怖如摧。病勿与药，虽凶可为。百凡谋望，居安虑危。\n\n### 火雷噬嗑\n> （五世）离上 震下\n\n- **卦象**：日中为市之卦，颐中有物之象。\n- **判曰**：噬嗑者，啮也。上下相合，物在颐间，饮食之事，聚会相延，财爻持世。求之不难。所为事理，内外俱安。\n\n### 山雷颐\n> （游魂）良上 震下\n\n- **卦象**：龙隐深潭之卦，迁善远恶之象。\n- **判曰**：颐者，养也。谨言节食，能养其身。震动艮止，万物皆春。恶事消散，不害于人。\n\n### 山风蛊\n> （归魂）艮上 巽下\n\n- **卦象**：三虫食血之卦，以恶害义之象。\n- **判曰**：蛊者，事也。干父之体，任用于先，三虫在器，阴害相连。厌昧之事，其疾难痊。求谋欲起，虑恐相干。\n\n## 坎宫八卦——属水\n\n### 坎为水\n> （纯卦）坎上 坎下（六冲）\n\n- **卦象**：船渡重滩之卦，外虚中实之象。\n- **判曰**：坎者，陷也。逢流则注，遇坎则止。出入艰难，随坎不已。阴愁伏匿，共相谋计，千里辞家，始免迍（zhūn）否。\n\n### 水泽节\n> （一世）坎上 兑下（六合）\n\n- **卦象**：船行风横之卦，寒暑有节之象。\n- **判曰**：节者，止也。天地得节，四时所成。节以制度，俭以丰盈。内忧外悦，不出户庭，于身谨节，无不康宁。\n\n### 水雷屯\n> （二世）坎上 震下\n\n- **卦象**：龙居浅水之卦，万物始生之象。\n- **判曰**：屯（zhūn）者，难也。象迍（zhūn）之时，动则难生，如常之事，先易后争。时方屯难，切忌远行，婚姻即吉，谋望不亨。\n\n### 水火既济\n> （三世）坎上 离下\n\n- **卦象**：舟楫济川之卦，阴阳配合之象。\n- **判曰**：既济，合也。水火相遇，会合之义。往渡得船，成功必济。所求必从，所从必遂。斯不失时，谓之既济。\n\n### 泽火革\n> （四世）兑上 离下\n\n- **卦象**：豹变为虎之卦，改旧从新之象。\n- **判曰**：革者，改也。改故就新，变易之道。交易其所，君子豹变。时有不遇，并宜改革。守旧则凶，从新则吉。\n\n### 雷火丰\n> （五世）震上 离下\n\n- **卦象**：日丽中天之卦，背暗向明之象。\n- **判曰**：丰者，大也。日中见斗，幽而不明，此事适大，隐映其形。水中见日，无所取呈。求财未得，事卒难明。\n\n### 地火明夷\n> （游魂）坤上 离下\n\n- **卦象**：凤凰垂翼之卦，出明入暗之象。\n- **判曰**：明夷者，伤也。火入地中，掩伤明德。君子在厄，三日不食。文王之难，困于丛棘。百凡谋望，且宜止息。\n\n### 地水师\n> （归魂）坤上 坎下\n\n- **卦象**：天马出群之卦，以寡伏众之象。\n- **判曰**：师者，众也。独行越师，最不宜动。君子有命，小人勿用。共相克伐，政道成讼。\n\n## 艮宫八卦——属土\n\n### 艮为山\n> （纯卦）艮上 艮下（六冲）\n\n- **卦象**：游鱼避网之卦，积小成高之象。\n- **判曰**：艮者，止也。纯艮危危，安静无亏。时止则止，时移则移。钱财散失，失在小儿，寻求不得，东北宜之。\n\n### 山火贲\n> （一世）艮上 离下\n\n- **卦象**：猛虎负嵎之卦，光明通泰之象。\n- **判曰**：贲者，饰也。光彩烜赫，火色含丹，文章交错，应杂其间，进退荣益，束帛戋戋。\n\n### 山天大畜\n> （二世）艮上 乾下\n\n- **卦象**：积小成高之卦，龙潜大壑之象。\n- **判曰**：大畜者，聚也。刚健笃实，积聚丰隆。居官食禄，建立其功。论讼有益。道理亨通。利涉大川，后吉先凶。\n\n### 山泽损\n> （三世）艮上 兑下\n\n- **卦象**：凿石见玉之卦，握土为山之象。\n- **判曰**：损者，益也。损上益下，后易先难。本非走失，事主忧官。必损而已，何以为安。\n\n### 火泽睽\n> （四世）离上 兑下\n\n- **卦象**：猛虎陷井之卦，二女同居之象。\n- **判曰**：睽者，背也。志不相得，作事乖违。口舌相伴，财散人离。病者难瘥，行者不归。\n\n### 天泽履\n> （五世）乾上 兑下\n\n- **卦象**：如履虎尾之卦，安中防危之象。\n- **判曰**：履者，礼也。如履虎尾，防虑宜深。坚冰之患，戒慎兢兢。安中防危，忧中望喜。眇而能视，跛而能履。\n\n### 风泽中孚\n> （游魂）巽上 兑下\n\n- **卦象**：鹤鸣子和之卦，事有定期之象。\n- **判曰**：中孚，信也。天地养育，万物安居，泽被草木，信及豚鱼。利涉大川，厄难消除。\n\n### 风山渐\n> （归魂）巽上 艮下\n\n- **卦象**：高山植木之卦，积小成大之象。\n- **判曰**：渐者，进也。渐进之义，动静皆宜。食无求饱，款曲施为，婚姻和合，行人将归。\n\n## 坤宫八卦——属土\n\n### 坤为地\n> （纯卦）坤上 坤下（六冲）\n\n- **卦象**：生载万物之卦，博厚无疆之象。\n- **判曰**：坤者，顺也。乃顺成天，万物资生。用动则浊，用静则清。所作有顺，万物皆成。\n\n### 地雷复\n> （一世）坤上 震下（六合）\n\n- **卦象**：淘沙见金之卦，反覆往来之象。\n- **判曰**：复者，反也。内悦外顺，举动无违。世应相合，迁官益财。失而复得，往而复来。婚姻占得，夫妇和谐。\n\n### 地泽临\n> （二世）坤上 兑下\n\n- **卦象**：凤入鸡群之卦，以上临下之象。\n- **判曰**：临者，大也。以大临小，以上临下，内柔外和，人非欺诈。居官进升，文才和雅。纵有灾害，不能相惹。\n\n### 地天泰\n> （三世）坤上 乾下（六合）\n\n- **卦象**：天地交畅之卦，小往大来之象。\n- **判曰**：泰者，通也。天地交泰，阴阳和光，麒麟悉出，丹凤来翔。小人道灭，君子道昌，求谋顺遂，恶事消亡。\n\n### 雷天大壮\n> （四世）震上 乾下（六冲）\n\n- **卦象**：先顺后逆之卦，羝羊触藩之象。\n- **判曰**：大壮者，志也。羝羊触藩，其道难全。令人刚强，已成过愆。非利勿贪，善莫大焉。\n\n### 泽天夬\n> （五世）兑上 乾下\n\n- **卦象**：神剑斩蛟之卦，先损后益之象。\n- **判曰**：夬者，决也。乾兑相刑，恶闻其声。文字契约，事未易成，必须刚断，始得吉亨。\n\n### 水天需\n> （游魂）坎上 乾下\n\n- **卦象**：云霭中天之卦，密云不雨之象。\n- **判曰**：需者，须也。云行于天，见险不前，身将有厄，恐被勾连。大事欲至，忧虑悬悬，光亨贞吉，利涉大川。\n\n### 水地比\n> （归魂）坎上 下坤\n\n- **卦象**：众星拱北之卦，水行地上之象。\n- **判曰**：比者，和也。抚临万国，内通外流，水行于地，本性和柔。先王制礼，以亲诸侯，元永贞吉，百事无忧。\n"};
